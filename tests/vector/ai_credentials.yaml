# Vector unit tests for `ai_scrub`'s credential-named assignment rule (basecradle-router#494,
# basecradle/basecradle#877), run by tests/test_vector_unit.py as
# `vector test <the shipped vector.yaml> <this file>`. Each event goes in at `ai_scrub` as a journald
# record and is read back out of it, so these run the shipped VRL and assert the exact bytes the log
# store receives.
#
# The rule: the value of every credential-named assignment, in every field, for every writer, becomes
# the box's marker `'<a value the box redacted>'`, and the name stays. A name is a credential's by the
# NOC canary's `credential_assignment` rule (tests/conftest.py, `NOC_CREDENTIAL_ASSIGNMENT`). The print
# site's marker `'<a redacted value>'` passes untouched, and so does the box's own.
#
# The writers are the box's real ones where a line is the fleet's (the router, 999; Nova, 1001), so
# the writer check passes them unmarked, and programs the fleet does not write (Caddy, sshd, a shell)
# everywhere else: the box layer exists for text the fleet did not author. Every value is a
# fabricated fake. No dollar sign anywhere in this file: Vector interpolates environment variables
# across a test file just as it does across a config.

tests:
  # --- what a value is: every reading, the name kept --------------------------------------------

  - name: "a foreign writer's credential-named assignment ships as the box marker"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "deploy.sh", "_UID": "1000", "message": "+ export DEPLOY_TOKEN=fabricatedDeployValue0001 && ./run"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[deploy.sh] + export DEPLOY_TOKEN='<a value the box redacted>' && ./run")

  - name: "every name the canary reads is redacted and the name stays"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # One of each word, a name with digits and underscores, one glued after lower-case letters
          # (the canary is unanchored, so `myAPI_KEY=` is `API_KEY=` to it), and a value of one
          # character: the print site redacts any value that is not empty, and so does the box.
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "message": "A_KEY=k1 B_TOKEN=t1 C_SECRET=s1 D_PASSWORD=p1 E_PASSPHRASE=q1 S3_BUCKET_2_KEY=v myAPI_KEY=w SHORT_KEY=x"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[env-dump] A_KEY='<a value the box redacted>' B_TOKEN='<a value the box redacted>' C_SECRET='<a value the box redacted>' D_PASSWORD='<a value the box redacted>' E_PASSPHRASE='<a value the box redacted>' S3_BUCKET_2_KEY='<a value the box redacted>' myAPI_KEY='<a value the box redacted>' SHORT_KEY='<a value the box redacted>'")

  - name: "a bare word and the one tail name a credential"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # @origin widened the canary on 2026-11-17 (basecradle-noc#1547, basecradle-router#504): the
          # credential word alone is a name, and `_BASE` is the one tail after it (`SECRET_KEY_BASE`,
          # the Rails master secret). The box reads the canary's definition, so it moves with it.
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "message": "KEY=abcdefghij PASSWORD=abcdefghij _TOKEN=x SECRET_KEY_BASE=fabricatedRailsSecret0001 env -i KEY_BASE=FABRICATEDCANARY0"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[env-dump] KEY='<a value the box redacted>' PASSWORD='<a value the box redacted>' _TOKEN='<a value the box redacted>' SECRET_KEY_BASE='<a value the box redacted>' env -i KEY_BASE='<a value the box redacted>'")

  - name: "a name the canary does not read is left as it is"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # Lower case, and a credential word with any tail but `_BASE` before the `=`: none is a
          # credential's name to the canary, so none is to the box (the definition is the canary's).
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "message": "x_token=abcdefghij TOKEN_FILE=/run/fabricated GH_TOKEN_FILE=/run/fabricated API_KEY_ID=abcdefghij MAX_TOKENS=1000000000 GIT_CONFIG_KEY_0=credential.helper"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[env-dump] x_token=abcdefghij TOKEN_FILE=/run/fabricated GH_TOKEN_FILE=/run/fabricated API_KEY_ID=abcdefghij MAX_TOKENS=1000000000 GIT_CONFIG_KEY_0=credential.helper")

  - name: "an empty value is left as it is"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "message": "EMPTY_TOKEN= next=1 | LAST_TOKEN="}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[env-dump] EMPTY_TOKEN= next=1 | LAST_TOKEN=")

  - name: "the value is the canary's run, a tab and the next assignment inside it included"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The canary reads a value up to a space, `"`, `,` or `}`, so a tab does not end it, and
          # what it would read as the value goes with it, whatever it holds.
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "message": "A_TOKEN=abc\tB_TOKEN=fabricatedValue0002 next=1 | C_TOKEN=v1,next=2 | D_TOKEN=v2}"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[env-dump] A_TOKEN='<a value the box redacted>' next=1 | C_TOKEN='<a value the box redacted>',next=2 | D_TOKEN='<a value the box redacted>'}")

  - name: "a value ends at every record break"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "message": "A_TOKEN=fabricatedValue0003\ntokens_in=5 cost=0.1\rB_TOKEN=fabricatedValue0004\u{2028}next=1"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[env-dump] A_TOKEN='<a value the box redacted>'\ntokens_in=5 cost=0.1\rB_TOKEN='<a value the box redacted>'\u{2028}next=1")

  - name: "a quoted value goes whole"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # Single-quoted, double-quoted before a blank or the end, and JSON-escaped inside a JSON
          # line: each is one value with its spaces, where the canary's run alone would stop at the
          # first space and ship the rest.
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "message": "A_PASSWORD='fabricated pass phrase' next=1 | B_PASSWORD=\"fabricated pass phrase\" next=2 | {\"cmd\":\"export C_TOKEN=\\\"fabricated value\\\" && go\",\"n\":3} | D_PASSWORD=\"fabricated end\""}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[env-dump] A_PASSWORD='<a value the box redacted>' next=1 | B_PASSWORD='<a value the box redacted>' next=2 | {\"cmd\":\"export C_TOKEN='<a value the box redacted>' && go\",\"n\":3} | D_PASSWORD='<a value the box redacted>'")

  - name: "a bearer value goes with its token"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The scheme word alone is the canary's whole value: redacted alone, it would leave the token
          # after the marker, where no later rule sees a bearer word. Doubled schemes, a tab, and a
          # bearer header glued to a value, as the `api[-_]?key=` rule takes them.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "_UID": "999", "message": "A_TOKEN=Bearer eyJhbGciOiJIUzI1NiJ9.e30.sig next=1 | B_TOKEN=Bearer Bearer\teyJhbGciOiJIUzI1NiJ9 next=2 | C_API_KEY=KBearer eyJhbGciOiJIUzI1NiJ9.e30 next=3 | D_TOKEN=Bearer"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] A_TOKEN='<a value the box redacted>' next=1 | B_TOKEN='<a value the box redacted>' next=2 | C_API_KEY='<a value the box redacted>' next=3 | D_TOKEN='<a value the box redacted>'")

  - name: "a scheme word a tab glues to a value goes with its token"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The canary's run crosses a tab, so a scheme word after one is inside the value, and the
          # token after it goes too (basecradle-router#502): after a word, at the value's head, and
          # after a quoted lead word. A quoted value holding a tab and a scheme word is one word, so
          # it opens no quote that could eat the fields after it.
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "message": "A_TOKEN=x\tBearer eyJhbGciOiJIUzI1NiJ9.e30.sig next=1 | B_TOKEN=\tBearer eyJhbGciOiJIUzI1NiJ9 next=2 | C_TOKEN='q'\tKBearer eyJhbGciOiJIUzI1NiJ9 next=3 | D_TOKEN='a\tBearer b' next=4 outcome=ok"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[env-dump] A_TOKEN='<a value the box redacted>' next=1 | B_TOKEN='<a value the box redacted>' next=2 | C_TOKEN='<a value the box redacted>' next=3 | D_TOKEN='<a value the box redacted>' next=4 outcome=ok")

  - name: "a credential name inside a value takes its own value with it"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The first value's word runs past a second name's `=` (basecradle-router#504's review, from
          # basecradle-harness#928); that name's value goes too, a scheme word's token included. A
          # name inside a quote is the quote's text, so nothing past the quote goes.
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "message": "A_TOKEN='a b'B_TOKEN=\tfabricatedSecret1 next=1 | C_TOKEN=\t'q'DB_PASSWORD=Bearer fabricatedSecret2 next=2 | D_TOKEN='E_TOKEN=x' next=3 other=4"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[env-dump] A_TOKEN='<a value the box redacted>' next=1 | C_TOKEN='<a value the box redacted>' next=2 | D_TOKEN='<a value the box redacted>' next=3 other=4")

  - name: "a credential-named value the shape rules would label carries the box marker"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The rule runs before the token-shape rules, so every credential-named assignment carries
          # the one marker the NOC counts, never `[REDACTED_GH_TOKEN]` or `apiKey=[REDACTED]`. The
          # same shapes under no credential name are still the shape rules'.
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "message": "GH_TOKEN=ghp_Fab1catedGithubToken000000000000 OPENAI_API_KEY=sk-proj-Fab1catedKey000000000000 | pushed with ghp_Fab1catedGithubToken000000000000"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[env-dump] GH_TOKEN='<a value the box redacted>' OPENAI_API_KEY='<a value the box redacted>' | pushed with [REDACTED_GH_TOKEN]")

  # --- what is not eaten: a line's structure, and what the NOC counts ---------------------------

  - name: "a bare quote after the equals sign is the line's own and is left as it is"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The close of the logfmt value, or of the JSON string, the assignment sits in: read as the
          # opening of a value, it took the next field. Its value is empty, so nothing is hidden.
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "message": "a=\"set FOO_TOKEN=\" b=\"x y\" c=1 | {\"a\":\"FOO_TOKEN=\",\"b\":1} | d=\"FOO_TOKEN=\" outcome=ok"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[env-dump] a=\"set FOO_TOKEN=\" b=\"x y\" c=1 | {\"a\":\"FOO_TOKEN=\",\"b\":1} | d=\"FOO_TOKEN=\" outcome=ok")

  - name: "a json line stays json"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # Caddy's access line, a value in a query string: the value is the canary's run, which ends
          # at the string's closing quote, so the line still parses and every other member is intact.
          . = {"SYSLOG_IDENTIFIER": "caddy", "_UID": "998", "message": "{\"level\":\"info\",\"logger\":\"http.log.access\",\"msg\":\"handled request\",\"request\":{\"method\":\"POST\",\"uri\":\"/hook?X_TOKEN=fabricatedQueryValue01&y=1\"},\"status\":202}"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[caddy] {\"level\":\"info\",\"logger\":\"http.log.access\",\"msg\":\"handled request\",\"request\":{\"method\":\"POST\",\"uri\":\"/hook?X_TOKEN='<a value the box redacted>'\"},\"status\":202}")
              line = parse_json!(slice!(.message, 8))
              assert_eq!(line.status, 202)
              assert_eq!(line.request.method, "POST")

  - name: "the counted lines are untouched"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The store's grammar (basecradle-harness docs/telemetry.md → The Grammar): every counted
          # field name is lower case, so none is a credential's, and `cached_tokens=` and
          # `cache_write_tokens=` sit one letter from one.
          . = {"SYSLOG_IDENTIFIER": "basecradle-wake-nova", "_UID": "1001", "message": "INFO llm provider=openrouter purpose=main endpoint=StreamLake model=z-ai/glm-5.2 duration=42.96s tokens_in=764942 tokens_out=236 tokens_total=765178 cached_tokens=238277 cache_write_tokens=1024 cost=0.0445 cost_basis=computed outcome=ok agent=nova generation_id=gen-1791030923-8abbrsSEsIk06gI224Fi"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-wake-nova] INFO llm provider=openrouter purpose=main endpoint=StreamLake model=z-ai/glm-5.2 duration=42.96s tokens_in=764942 tokens_out=236 tokens_total=765178 cached_tokens=238277 cache_write_tokens=1024 cost=0.0445 cost_basis=computed outcome=ok agent=nova generation_id=gen-1791030923-8abbrsSEsIk06gI224Fi")

  - name: "a charge and a key spend line are untouched"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-wake-nova", "_UID": "1001", "message": "INFO charge provider=steel kind=browser.session executor=mcp unit=minute count=7 duration=402.18s started=2026-11-01T03:12:40Z resource=01a19518-4c40-7c41-9f3e-5d8c1a2b4e60 outcome=ok cost=0.07 | INFO key spend provider=openrouter outcome=ok spent=1.047832516 timeline=019f6e71-2a12-7b69-a204-0fec1497b9c2"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-wake-nova] INFO charge provider=steel kind=browser.session executor=mcp unit=minute count=7 duration=402.18s started=2026-11-01T03:12:40Z resource=01a19518-4c40-7c41-9f3e-5d8c1a2b4e60 outcome=ok cost=0.07 | INFO key spend provider=openrouter outcome=ok spent=1.047832516 timeline=019f6e71-2a12-7b69-a204-0fec1497b9c2")

  - name: "a router stage line is untouched"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "_UID": "999", "message": "INFO basecradle_router.pipeline stage=wake outcome=ok agent=nova route=github delivery=0192f3a4-5b6c-7d8e-9f01-00000000000a duration=12.40s"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] INFO basecradle_router.pipeline stage=wake outcome=ok agent=nova route=github delivery=0192f3a4-5b6c-7d8e-9f01-00000000000a duration=12.40s")

  # --- the two markers pass untouched -----------------------------------------------------------

  - name: "a value the print site redacted passes the box untouched"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The router's renderer writes the print site's marker, inside a quoted value when the value
          # holds a space. The box counts only what it redacts itself, so these pass as they came:
          # the `api[-_]?key=` rule included, which read `'<a` as a value and shipped
          # `ANTHROPIC_apiKey=[REDACTED] redacted value>'` before it kept a marker.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "_UID": "999", "message": "WARNING tool name=bash outcome=error detail=\"refused: export DEPLOY_TOKEN='<a redacted value>' && go\" cost=0 | ANTHROPIC_API_KEY='<a redacted value>' | api_key='<a redacted value>'"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] WARNING tool name=bash outcome=error detail=\"refused: export DEPLOY_TOKEN='<a redacted value>' && go\" cost=0 | ANTHROPIC_API_KEY='<a redacted value>' | api_key='<a redacted value>'")

  - name: "the assignment rule keeps a marker only where the canary's run would end"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # A lower-case name never reaches the credential rule. A marker with a value glued to it is
          # a value to the assignment rule too, and goes whole; one before a blank is kept.
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "message": "api_key='<a redacted value>'fabricatedTail0001 next=1 | api_key='<a redacted value>' next=2"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[env-dump] apiKey=[REDACTED] next=1 | api_key='<a redacted value>' next=2")

  - name: "the box marker is redacted to itself"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # A line scrubbed twice (a relay through a second box) ships the same bytes.
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "message": "A_TOKEN='<a value the box redacted>' next=1 | OPENAI_API_KEY='<a value the box redacted>'"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[env-dump] A_TOKEN='<a value the box redacted>' next=1 | OPENAI_API_KEY='<a value the box redacted>'")

  # --- the review's cases (basecradle-router#494): each shipped a value, or ate a field ---------

  - name: "a double-quoted value goes whole with what is glued after it"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # Python's repr of an argv, which a failed command's traceback prints, and a shell line.
          # The quote opens outside every quote, so it opens the value; what is glued after its close
          # goes with it, as the print site reads the shell word.
          . = {"SYSLOG_IDENTIFIER": "deploy.py", "_UID": "1000", "message": "Command '['sh', '-c', 'export X_TOKEN=\"fabricatedSecret0001\"']' failed | Y_TOKEN=\"fabricatedSecret0002\"; ./run | (Z_TOKEN=\"fabricatedSecret0003\")"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[deploy.py] Command '['sh', '-c', 'export X_TOKEN='<a value the box redacted>' failed | Y_TOKEN='<a value the box redacted>' ./run | (Z_TOKEN='<a value the box redacted>'")

  - name: "a bearer token is the whole run after the scheme word"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # Its `=` included: a fleet line quotes any value that holds one, so a scheme word with a
          # bare field after it is never a fleet line's, and redaction comes first.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "_UID": "999", "message": "stage=wake X_TOKEN=Bearer cost=0.1 outcome=ok | Y_TOKEN=Bearer abcdefgh== next=1"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] stage=wake X_TOKEN='<a value the box redacted>' outcome=ok | Y_TOKEN='<a value the box redacted>' next=1")

  - name: "a bearer token goes whole whatever it holds"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # A token holding a `:` or a `%`, glued or not, and its padding: before, the token ended at
          # the first character outside the bearer rule's class and its tail shipped after the marker.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "_UID": "999", "message": "X_API_KEY=KBearer abcdefgh:fabricatedTail0003 next=1 | Y_TOKEN=Bearer abc%3Afabricated== next=2"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] X_API_KEY='<a value the box redacted>' next=1 | Y_TOKEN='<a value the box redacted>' next=2")

  - name: "a value glued after a marker is a value"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # A marker is kept only before a delimiter: glued on after one, a value goes, in the
          # credential rule and in the `api[-_]?key=` rule alike.
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "message": "X_TOKEN='<a redacted value>'fabricatedGlued0004 next=1 | Y_TOKEN='<a value the box redacted>'fabricatedGlued0005"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[env-dump] X_TOKEN='<a value the box redacted>' next=1 | Y_TOKEN='<a value the box redacted>'")

  - name: "a record break right after the equals sign gets the marker and loses nothing"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The canary's run crosses a record break, so it would read the next record as this value:
          # the marker stands before the break, and the break and the next record stay.
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "message": "X_TOKEN=\nfabricatedAfterBreak0005 next=1"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[env-dump] X_TOKEN='<a value the box redacted>'\nfabricatedAfterBreak0005 next=1")

  - name: "an unclosed json-escaped value goes whole"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # A JSON line cut short: the escaped quote never closes, and the value runs to the string's
          # own end.
          . = {"SYSLOG_IDENTIFIER": "caddy", "_UID": "998", "message": "{\"cmd\":\"export X_TOKEN=\\\"fabricatedUnclosed0006\",\"n\":1}"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[caddy] {\"cmd\":\"export X_TOKEN='<a value the box redacted>'\",\"n\":1}")

  - name: "a quote read by its parity: a value opened outside, a close inside"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # Whatever follows a closed value, a value never closed on its record, and the close of a
          # quoted value whose next field's own value is empty: each read by the count of quotes
          # before it, as every fleet consumer reads a line.
          . = {"SYSLOG_IDENTIFIER": "deploy.sh", "_UID": "1000", "message": "Set X_TOKEN=\"fabricatedSecret0003\". done | export Y_TOKEN=\"fabricated secret value"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[deploy.sh] Set X_TOKEN='<a value the box redacted>' done | export Y_TOKEN='<a value the box redacted>'")

  - name: "an empty value inside a quoted value keeps the next field"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The next field's value is empty: read by what follows the quote, `\" b=\"` was a value.
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "message": "a=\"X_TOKEN=\" b=\"\" c=1"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[env-dump] a=\"X_TOKEN=\" b=\"\" c=1")

  - name: "an unclosed single-quoted value goes whole"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # A passphrase cut at the record's end: the canary's run alone took its first word.
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "message": "X_PASSPHRASE='correct horse battery"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[env-dump] X_PASSPHRASE='<a value the box redacted>'")

  - name: "a bearer token holding an equals sign goes whole"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # Only a lower-case name and an `=` is the next field; any other token goes whole.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "_UID": "999", "message": "X_TOKEN=Bearer fabricatedSecret=x next=1 | Y_TOKEN=Bearer A1b2=c3 next=2"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] X_TOKEN='<a value the box redacted>' next=1 | Y_TOKEN='<a value the box redacted>' next=2")

  - name: "a request's single quote never takes an access line's json with it"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # Anyone who can reach the web server writes this line: a `'` in a query value is read to
          # the `\"` that closes the JSON string, never past it.
          . = {"SYSLOG_IDENTIFIER": "caddy", "_UID": "998", "message": "{\"level\":\"info\",\"request\":{\"uri\":\"/hook?X_TOKEN='abc&y=1\"},\"status\":202}"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[caddy] {\"level\":\"info\",\"request\":{\"uri\":\"/hook?X_TOKEN='<a value the box redacted>'\"},\"status\":202}")

  - name: "a shell word holding a quote goes whole"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # An escaped backslash before the quote, one name's value holding another's, two quoted
          # pieces, a quote inside the value: each one value, as the print site reads it.
          . = {"SYSLOG_IDENTIFIER": "deploy.sh", "_UID": "1000", "message": "A_TOKEN=\\\\\"fabricatedSecret0001\" next=1 | B_TOKEN=C_TOKEN=\"fabricatedSecret0002\" next=2 | D_TOKEN=\"fabricated\"\"Secret0003\" next=3 | E_TOKEN=abc\"def ghi\" next=4"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[deploy.sh] A_TOKEN='<a value the box redacted>' next=1 | B_TOKEN='<a value the box redacted>' next=2 | D_TOKEN='<a value the box redacted>' next=3 | E_TOKEN='<a value the box redacted>' next=4")

  - name: "an escaped quote is no quote"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # Outside a quote a backslash escapes a `\"`, so the value is the escaped one's, and the
          # next field stays; a name right after a backslash is still read.
          . = {"SYSLOG_IDENTIFIER": "deploy.sh", "_UID": "1000", "message": "X_API_KEY=\\\"fabricatedSecret0005\\\"abc next=1 | \\Y_TOKEN=\"fabricatedSecret0006\" next=2"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[deploy.sh] X_API_KEY='<a value the box redacted>' next=1 | \\Y_TOKEN='<a value the box redacted>' next=2")

  - name: "a marker inside a quoted value is kept"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The print site never writes one so, but a marker is a value already redacted wherever it
          # stands, and counting it would count a leak that never happened.
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "message": "X_TOKEN=\"'<a redacted value>'\" next=1"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[env-dump] X_TOKEN=\"'<a redacted value>'\" next=1")

  - name: "a stray quote earlier never lets a quoted value through"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # An inch mark and a traceback's `'\"'` flip the parity, so the value's own quote reads as a
          # close; a quoted value closed before a word's end goes whatever the parity.
          . = {"SYSLOG_IDENTIFIER": "deploy.py", "_UID": "1000", "message": "board is 5\" wide; export X_TOKEN=\"fabricated secret value\" && run | KeyError: '\"' while parsing DEPLOY_TOKEN=\"fabricated s3cret\""}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[deploy.py] board is 5\" wide; export X_TOKEN='<a value the box redacted>' && run | KeyError: '\"' while parsing DEPLOY_TOKEN='<a value the box redacted>'")

  - name: "a record's quotes span its lines"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # A journal record is one record: a quoted value that holds a line break is still open after it,
          # so a credential inside it ends at the quote's close, and one after it is read outside.
          . = {"SYSLOG_IDENTIFIER": "deploy.sh", "_UID": "1000", "message": "msg=\"hello\nX_TOKEN=secretvalue1\" more | a=\"x\nb\" Y_TOKEN=\"secret value here\" end"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[deploy.sh] msg=\"hello\nX_TOKEN='<a value the box redacted>'\" more | a=\"x\nb\" Y_TOKEN='<a value the box redacted>' end")

  - name: "a value ending in a word the box does not read as a scheme word ends there, the stated limit"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The box reads a glued scheme word only as HTTP spells it (#497), so `abc-bearer` keeps the
          # field after it. The fleet's definition reads any word ending in `bearer` (#510), which the
          # print site does; on the box it is a stated limit until its literal rules run as one
          # alternation (deploy/README.md, tests/test_vector_unit.py `_LIMIT`).
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "message": "X_TOKEN=abc-bearer next=1 other=2 | Y_TOKEN=KBearer eyJhbGciOiJIUzI1NiJ9 next=3"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[env-dump] X_TOKEN='<a value the box redacted>' next=1 other=2 | Y_TOKEN='<a value the box redacted>' next=3")

  - name: "a marker ends at the same place in both rules"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # A no-break space after a marker is glued to it in the assignment rule as in the credential
          # rule: the value with it goes.
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "message": "X_API_KEY='<a redacted value>'\u{a0}fabricatedGlued | api_key='<a redacted value>'\u{a0}fabricatedGlued"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[env-dump] X_API_KEY='<a value the box redacted>' | apiKey=[REDACTED]")

  # --- every field, and every writer ------------------------------------------------------------

  - name: "every string field is redacted, not only the message"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The writer chooses all of these: its identifier, the code fields, a field it names itself,
          # one it sends twice (the journal then holds a list), and the binary it runs. A number is
          # not a string and is left as it is.
          . = {"SYSLOG_IDENTIFIER": "job-A_TOKEN=fabricatedValue0005", "_UID": "1000", "_COMM": "B_KEY=fabr", "_EXE": "/tmp/C_SECRET=fabricatedValue0006/run", "CODE_FUNC": "load(D_PASSWORD=fabricatedValue0007)", "NOTE": "E_TOKEN=fabricatedValue0008", "REPEATED": ["F_TOKEN=fabricatedValue0009", "plain"], "PRIORITY": 6, "message": "started"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[job-A_TOKEN='<a value the box redacted>'] started")
              assert_eq!(.SYSLOG_IDENTIFIER, "job-A_TOKEN='<a value the box redacted>'")
              assert_eq!(._COMM, "B_KEY='<a value the box redacted>'")
              # The value is the canary's run, so the path after it goes too, and the closing parenthesis.
              assert_eq!(._EXE, "/tmp/C_SECRET='<a value the box redacted>'")
              assert_eq!(.CODE_FUNC, "load(D_PASSWORD='<a value the box redacted>'")
              assert_eq!(.NOTE, "E_TOKEN='<a value the box redacted>'")
              assert_eq!(.REPEATED, ["F_TOKEN='<a value the box redacted>'", "plain"])
              assert_eq!(.PRIORITY, 6)

  - name: "a field whose own name is a credential's ships the box marker as its whole value"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # `DEPLOY_API_KEY=…` sent as a journal field is that assignment in the journal's own format.
          # Every value it holds goes, each of a list's; an empty value and a marker stay, so a source
          # that sent its own redaction is never counted as a leak; a field named like one but not
          # one stays.
          . = {"SYSLOG_IDENTIFIER": "env-dump", "_UID": "1000", "DEPLOY_API_KEY": "fabricatedFieldValue01", "SESSION_TOKEN": ["fabricatedFieldValue02", "", "'<a redacted value>'"], "ANTHROPIC_API_KEY": "'<a redacted value>'", "EMPTY_TOKEN": "", "VAULT_PASSPHRASE": "fabricatedFieldValue04", "TOKEN_FILE": "/run/fabricated", "message": "started"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.DEPLOY_API_KEY, "'<a value the box redacted>'")
              assert_eq!(.SESSION_TOKEN, ["'<a value the box redacted>'", "", "'<a redacted value>'"])
              assert_eq!(.ANTHROPIC_API_KEY, "'<a redacted value>'")
              assert_eq!(.EMPTY_TOKEN, "")
              assert_eq!(.VAULT_PASSPHRASE, "'<a value the box redacted>'")
              assert_eq!(.TOKEN_FILE, "/run/fabricated")
              assert_eq!(.message, "[env-dump] started")

  - name: "a line marked unverified is redacted exactly as one that is not"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # John's login session writing under Nova's wake identifier: marked by the writer check,
          # and redacted first, so the marker stands before a line already scrubbed.
          . = {"SYSLOG_IDENTIFIER": "basecradle-wake-nova", "_UID": "1000", "message": "INFO llm provider=anthropic cost=9.9 note=DEPLOY_TOKEN=fabricatedValue0010"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[unverified-basecradle-wake-nova] UNVERIFIED uid=1000 INFO llm provider=anthropic cost=9.9 note=DEPLOY_TOKEN='<a value the box redacted>'")
              assert_eq!(.SYSLOG_IDENTIFIER, "unverified-basecradle-wake-nova")

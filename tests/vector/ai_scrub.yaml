# Vector unit tests for `ai_scrub`'s redaction (basecradle-router#398), run by
# tests/test_vector_unit.py as `vector test <the shipped vector.yaml> <this file>`. Each event goes
# in at `ai_scrub` as a journald line and is read back out of it, so the tests run the shipped VRL and
# assert the exact bytes Better Stack receives.
#
# The rule under test is the harness's: two passes, literal rules then prefix rules, and a prefixed
# match kept only when `_is_word` reads it as a word (basecradle-harness docs/telemetry.md →
# Credential Scrubbing, harness 0.186.0). The samples are the harness's own (its
# tests/test_log_value_cut.py), lengthened to the box's minimums where the harness's are shorter:
# the box's `sk-` run needs 16 characters where the harness's needs 8, so `task-specification`, whose
# run is 13, never met the box's rule at all, and the long forms below are the ones that did.
#
# Every key is a fabricated, correctly shaped fake. No dollar sign anywhere in this file: Vector
# interpolates environment variables across a test file just as it does across a config.

tests:
  # --- the literal rules run first: a prefix run never swallows a literal's key name -------------

  - name: "an api-key assignment glued to a prefix run redacts its secret"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "failed: task-runner-pipeline-api-key=abc123secret rejected"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              # The secret is gone. The word before it is cut as well, because the box's label
              # `apiKey=` carries a capital that the word rule reads as evidence of a key.
              assert_eq!(.message, "[basecradle-router] failed: ta[REDACTED_API_KEY]=[REDACTED] rejected")

  - name: "an api-key assignment inside an sk- run redacts its secret"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "failed: sk-runner-pipeline-api-key=abc123secret rejected"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] failed: [REDACTED_API_KEY]=[REDACTED] rejected")

  - name: "an underscored api_key assignment glued to a prefix run redacts its secret"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "failed: risk-model-pipeline_api_key=hunter2xyz rejected"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] failed: ri[REDACTED_API_KEY]=[REDACTED] rejected")

  - name: "a bearer glued to a github-token run redacts its credential"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "failed: weighs_requestauthorizationbearer eyJhbGciOiJIUzI1NiJ9.e30.abc rejected"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] failed: wei[REDACTED_GH_TOKEN] [REDACTED] rejected")

  - name: "a bearer glued to a short prefix run redacts its credential"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "failed: task-runner-bearer abcdefgh123 rejected"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] failed: task-runner-Bearer [REDACTED] rejected")

  - name: "an assignment whose value is a bearer header redacts the token after the scheme"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "failed: AUTH_API_KEY=Bearer eyJhbGciOiJIUzI1NiJ9.e30.abc rejected"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] failed: AUTH_apiKey=[REDACTED] rejected")

  - name: "a heartbeat url after a bearer word redacts its secret"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The bearer rule's token class takes a URL's `https`, so with bearer first the heartbeat
          # rule never matched and the secret shipped.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "token bearer https://uptime.betterstack.com/api/v1/heartbeat/SECRETabc123 done"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] token bearer [REDACTED_HEARTBEAT_URL] done")

  - name: "a heartbeat url logged without its scheme redacts its secret"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The harness anchors on the literal `/heartbeat/`; anchored on `https?://`, a URL logged
          # without its scheme matched nothing and shipped its secret. The host is not the secret.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "curl uptime.betterstack.com/api/v1/heartbeat/SECRETabc123 failed"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] curl uptime.betterstack.com/api/v1[REDACTED_HEARTBEAT_URL] failed")

  - name: "a heartbeat url with userinfo redacts the credential before the host"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # Anchored on `/heartbeat/` alone, the rule would keep everything before it, the password
          # in the userinfo included. A URL with a scheme is taken from the scheme on.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "ping https://john:hunter2Secret@uptime.example.com/api/v1/heartbeat/SECRETabc123 failed"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] ping [REDACTED_HEARTBEAT_URL] failed")

  # --- a bearer word ending a heartbeat run is kept for the bearer rule (basecradle-router#402) ---

  - name: "a bearer word ending a heartbeat run in compact json redacts its token"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The heartbeat match runs to the end of the space-free run, which ends in `Bearer`. Taken
          # with the URL, the word left its token in the next run, which no rule matched.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": s'{"url":"https://h.example.com/heartbeat/K9","auth":"Bearer eyJhbGciOiJIUzI1NiJ9.e30.SIG"}'}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, s'[basecradle-router] {"url":"[REDACTED_HEARTBEAT_URL]Bearer [REDACTED]"}')

  - name: "a bearer word ending a heartbeat run in a query value redacts its token"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "ping https://h.example.com/x?token=abc/heartbeat/K9&access_token=Bearer eyJhbGciOiJIUzI1NiJ9.e30 failed"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] ping [REDACTED_HEARTBEAT_URL]Bearer [REDACTED] failed")

  - name: "a bearer word ending a heartbeat run is kept in any case"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "ping uptime.example.com/heartbeat/K9&auth=BEARER eyJhbGciOiJIUzI1NiJ9.e30 failed"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] ping uptime.example.com[REDACTED_HEARTBEAT_URL]Bearer [REDACTED] failed")

  - name: "a heartbeat secret glued to a bearer word is redacted whole"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # Glued to a letter or digit, the word is the secret's own tail, never a scheme word, so
          # it is never kept: a secret whose last letters merely spell it is redacted whole.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "ping https://h.example.com/heartbeat/K9xbearer failed"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] ping [REDACTED_HEARTBEAT_URL] failed")

  - name: "a doubled bearer scheme after a heartbeat run redacts the token after both"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "ping https://h.example.com/heartbeat/K9&auth=Bearer Bearer eyJhbGciOiJIUzI1NiJ9.e30 failed"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] ping [REDACTED_HEARTBEAT_URL]Bearer [REDACTED] failed")

  - name: "a bearer word ending a heartbeat run at the end of the line ships as the word alone"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # Nothing follows the word for the bearer rule to take, so the word is all that ships.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "ping https://h.example.com/heartbeat/K9&auth=Bearer"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] ping [REDACTED_HEARTBEAT_URL]Bearer")

  - name: "a bearer word inside a heartbeat run, not ending it, is redacted with the url"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # Only a word that ENDS the run is put back. The run's last six characters here are a
          # secret, and a bearer word earlier in the run must never put them back.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "ping https://h.example.com/heartbeat/K9?auth=bearer&sig=Zq7Sec failed"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] ping [REDACTED_HEARTBEAT_URL] failed")

  - name: "a bearer whose value is an assignment redacts the secret after it"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The bearer rule's token class takes `api_key` and its `=`, so with bearer first the
          # assignment rule never matched and the secret after `=` shipped.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "Authorization: Bearer api_key=Zq7SecretFab1cated rejected"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] Authorization: Bearer [REDACTED][REDACTED] rejected")

  - name: "a doubled bearer scheme redacts the token after both"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # A token stored with its scheme and sent with another reads `Bearer Bearer eyJ…`.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "Authorization: Bearer Bearer eyJhbGciOiJIUzI1NiJ9.e30.abc | AUTH_API_KEY=Bearer Bearer eyJhbGciOiJIUzI1NiJ9.e30.sig | GET /v1/models?api_key=Bearer\tbearer eyJhbGciOiJIUzI1NiJ9 HTTP/1.1"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] Authorization: Bearer [REDACTED] | AUTH_apiKey=[REDACTED] | GET /v1/models?apiKey=[REDACTED] HTTP/1.1")

  - name: "a query key whose value is a bearer header redacts the token after the scheme"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "GET https://example.com/v1?api_key=Bearer eyJhbGciOiJIUzI1NiJ9 rejected"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] GET https://example.com/v1?apiKey=[REDACTED] rejected")

  # --- the Steel key, the api-key query shape and the env dump (moved from tests/test_log_surface.py) ---

  - name: "a steel key in the connect url is redacted and the rest survives"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # Fabricated: the real keys are `ste-` + 99 alphanumerics, so this matches their length.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "connecting to wss://connect.steel.dev?sessionId=0199a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2b&apiKey=ste-Fab1catedFab1catedFab1catedFab1catedFab1catedFab1catedFab1catedFab1catedFab1catedFab1catedFab1cated"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] connecting to wss://connect.steel.dev?sessionId=0199a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2b&apiKey=[REDACTED]")

  - name: "the query rule stops at the next parameter"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "wss://connect.steel.dev?apiKey=ste-Fab1catedFab1catedFab1catedFab1catedFab1catedFab1catedFab1catedFab1catedFab1catedFab1catedFab1cated&sessionId=0199a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2b"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] wss://connect.steel.dev?apiKey=[REDACTED]&sessionId=0199a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2b")

  - name: "a steel key outside a url is redacted by its prefix"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The header form carries no `apiKey=`, so only the `ste-` rule can catch it.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "POST https://api.steel.dev/v1/sessions steel-api-key: ste-Fab1catedFab1catedFab1catedFab1catedFab1catedFab1catedFab1catedFab1catedFab1catedFab1catedFab1cated"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] POST https://api.steel.dev/v1/sessions steel-api-key: [REDACTED_API_KEY]")

  - name: "the query rule redacts a value of any shape under any spelling of its name"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "GET /v1/tools?apiKey=novaOpaqueFabricatedValue0001 \"ok\" | GET /v1/tools?api_key=novaOpaqueFabricatedValue0001 \"ok\" | GET /v1/tools?API-KEY=novaOpaqueFabricatedValue0001 \"ok\" | GET /v1/tools?apikey=novaOpaqueFabricatedValue0001 \"ok\""}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] GET /v1/tools?apiKey=[REDACTED] \"ok\" | GET /v1/tools?apiKey=[REDACTED] \"ok\" | GET /v1/tools?apiKey=[REDACTED] \"ok\" | GET /v1/tools?apiKey=[REDACTED] \"ok\"")

  - name: "an env dump api key is redacted whatever its provider"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The name is normalised and the value never ships, even for a provider no prefix rule knows.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "STEEL_API_KEY=novaOpaqueFabricatedValue0001 ANTHROPIC_API_KEY=sk-ant-0000000000000000000000000000000000000000"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] STEEL_apiKey=[REDACTED] ANTHROPIC_apiKey=[REDACTED]")

  # --- a vendor prefix inside a word is a word -------------------------------------------------

  - name: "an sk- word glued to a letter survives whole"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "the task-specification-for-this-run is invalid: disk-quota-exceeded-for-org, risk-assessment-pending-review"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] the task-specification-for-this-run is invalid: disk-quota-exceeded-for-org, risk-assessment-pending-review")

  - name: "the issue's short words survive whole"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "task-specification failed: disk-quota-exceeded, risk-assessment"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] task-specification failed: disk-quota-exceeded, risk-assessment")

  - name: "a word in another script keeps its prefix"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "Rísk-assessment-pending-review; Gäste-registrierungssystem-voll"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] Rísk-assessment-pending-review; Gäste-registrierungssystem-voll")

  - name: "a github-token and a user-token prefix inside a word survive whole"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "laughs_happilyeverafterandafter abc_uat_unknown"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] laughs_happilyeverafterandafter abc_uat_unknown")

  - name: "a word under the wide basecradle rule survives whole"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # `bc_def_` with a run of eight or more lowercase letters, glued to a letter, is a word.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "the abc_def_ghijklmnop table"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] the abc_def_ghijklmnop table")

  - name: "the harness 0.185.0 prefixes inside a word survive whole"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The harness's own words for its three newest prefixes (basecradle-router#421), and one for
          # `pplx-`, which it has none of. The `tk_` run takes `_`, so `gtk_window_…` is decided by the
          # word rule, never by where the run stops.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "tabl_partitionmaintenancewindow kabl_verbindungsueberwachungsdienst xpplx-abcdefghijklmnopqrstuvwxyz atk_objectgetaccessiblename gtk_window_set_default_size_request"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] tabl_partitionmaintenancewindow kabl_verbindungsueberwachungsdienst xpplx-abcdefghijklmnopqrstuvwxyz atk_objectgetaccessiblename gtk_window_set_default_size_request")

  - name: "a word glued by a digit, a combining mark or any script is kept"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "7sk-specificationsforall e\u{301}sk-specificationsforall 密sk-specificationsforall"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] 7sk-specificationsforall e\u{301}sk-specificationsforall 密sk-specificationsforall")

  - name: "a prefix that holds a digit or a capital is not read as its run"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "xr8_abcdefghijklmnopqrstuvwx xAIzaabcdefghijklmnopqrstuvwx | r8_abcdefghijklmnopqrstuvwx"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] xr8_abcdefghijklmnopqrstuvwx xAIzaabcdefghijklmnopqrstuvwx | [REDACTED_API_KEY]")

  - name: "a word kept by one prefix rule is never cut by another"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The `sk-` run takes `hf_…` whole and is kept as a word. One rule per pass would read the
          # `hf_` inside it again, after an underscore, and cut it.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "task-queue_hf_abcdefghijklmnopqrstuvwx drained"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] task-queue_hf_abcdefghijklmnopqrstuvwx drained")

  # --- a key is still a key, whatever it is glued to -------------------------------------------

  - name: "a glued run with a digit or a capital is redacted however wordlike"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "ask-specifications2026 7sk-specifications2026 ésk-Specificationsforall 密sk-Specificationsforall"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] a[REDACTED_API_KEY] 7[REDACTED_API_KEY] é[REDACTED_API_KEY] 密[REDACTED_API_KEY]")

  - name: "an unglued lowercase run is still redacted"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "sk-abcdefghijklmnopqr key sk-abcdefghijklmnop x-hf_abcdefghijklmnopqrstuvwx"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |

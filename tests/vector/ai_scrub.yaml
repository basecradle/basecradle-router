          # of the first: a narrower run stopped at `_isk_` and shipped `DEF123`.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "keys bc_uat_ABCbc_isk_DEF123 and bc_isk_Ab3Cd5Ef7Gh9_x-y bc_tok_Ab3Cd5Ef7Gh9 loaded"}

  # --- the harness 0.185.0 shapes: refuseless, Perplexity and ntfy (basecradle-router#421) ------

  - name: "a refuseless, a perplexity and an ntfy key are redacted as values"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The samples are the harness's (tests/test_log_value_cut.py): a 52-character `abl_` key, the
          # vendor's shape, a `pplx-` key kept shorter than a real one's 48, and a 32-character `tk_`.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "stage=wake outcome=failed refuseless_key=abl_Kq7Zt2Wm9Rx4Lp6Vn3Hs8Dj5Fb1Gc0Ye7Ua2Ti9Ow4Qe6Nr3 perplexity_key=pplx-Rm4Tq8Zw2Xk6Lp9Vb3Nc7Hd1 ntfy_token=tk_q8m2zr5wk1xt7nb4pv9hc3jd6fs0l"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] stage=wake outcome=failed refuseless_key=[REDACTED_API_KEY] perplexity_key=[REDACTED_API_KEY] ntfy_token=[REDACTED_API_KEY]")

  - name: "a refuseless, a perplexity and an ntfy key are redacted in free text"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "refuseless refused the key abl_Kq7Zt2Wm9Rx4Lp6Vn3Hs8Dj5Fb1Gc0Ye7Ua2Ti9Ow4Qe6Nr3, check AI_API_KEY; perplexity refused pplx-Rm4Tq8Zw2Xk6Lp9Vb3Nc7Hd1. ntfy refused tk_q8m2zr5wk1xt7nb4pv9hc3jd6fs0l: unauthorized"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] refuseless refused the key [REDACTED_API_KEY], check AI_API_KEY; perplexity refused [REDACTED_API_KEY]. ntfy refused [REDACTED_API_KEY]: unauthorized")

  - name: "a refuseless, a perplexity and an ntfy key are redacted inside a quoted error body"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # A vendor's quoted error body is the realistic carrier, the harness's case.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "upstream said \"{\"error\":{\"message\":\"Incorrect API key provided: abl_Kq7Zt2Wm9Rx4Lp6Vn3Hs8Dj5Fb1Gc0Ye7Ua2Ti9Ow4Qe6Nr3\",\"code\":401}}\" perplexity said 'pplx-Rm4Tq8Zw2Xk6Lp9Vb3Nc7Hd1' ntfy said \"{\"token\":\"tk_q8m2zr5wk1xt7nb4pv9hc3jd6fs0l\",\"code\":40101}\""}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] upstream said \"{\"error\":{\"message\":\"Incorrect API key provided: [REDACTED_API_KEY]\",\"code\":401}}\" perplexity said '[REDACTED_API_KEY]' ntfy said \"{\"token\":\"[REDACTED_API_KEY]\",\"code\":40101}\"")

  - name: "an ntfy token in every shape its validator admits is redacted whole"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # ntfy generates lowercase letters and digits, and its validator also admits capitals, `_` and
          # `-` in a token's 29 characters, so a provisioned token's `-` or `_` never cuts it short.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "ntfy refused tk_q8m2zr5wk-xt7nb4pv9_hc3jd6fs0: unauthorized | ntfy refused tk_Q8m2zr5wk1xt7nb4pv9hc3jd6fs0l: unauthorized"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] ntfy refused [REDACTED_API_KEY]: unauthorized | ntfy refused [REDACTED_API_KEY]: unauthorized")

  - name: "a tk_ identifier not glued to a letter or digit is redacted, as the harness's is"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The word rule keeps only a match glued to a letter, digit or mark, so after a `.` the run
          # is read as a token whatever its letters, the residual the harness states for every rule.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "self.tk_root_window_initialized ok"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-router] self.[REDACTED_API_KEY] ok")

  - name: "every prefixed key after every left neighbour is still redacted"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # One fabricated key per prefix rule, at the box's own minimum, each with the label its
          # rule writes.
          keys = [
            ["ghp_Ab3Cd5Ef7Gh9Ij1Kl3Mn", "[REDACTED_GH_TOKEN]"],
            ["ghs_Ab3Cd5Ef7Gh9Ij1Kl3Mn", "[REDACTED_GH_TOKEN]"],
            ["github_pat_11ABCDEFG0abcdefghij_klmnopqrstuv", "[REDACTED_GH_TOKEN]"],
            ["bc_uat_K", "[REDACTED_BC_TOKEN]"],
            ["bc_isk_K", "[REDACTED_BC_INTEGRATION_SECRET]"],
            ["bc_isk_Ab3Cd5Ef7Gh9", "[REDACTED_BC_INTEGRATION_SECRET]"],
            ["bc_tok_Ab3Cd5Ef7Gh9", "[REDACTED_BC_TOKEN]"],
            ["sk-ant-api03-Ab3Cd5Ef7Gh9", "[REDACTED_API_KEY]"],
            ["sk-or-v1-0f3a9c2b7d4e6f8a", "[REDACTED_API_KEY]"],
            ["xai-Ab3Cd5Ef7Gh9Ij1K", "[REDACTED_API_KEY]"],
            ["AIzaAb3Cd5Ef7Gh9Ij1Kl3Mn", "[REDACTED_API_KEY]"],
            ["hf_Ab3Cd5Ef7Gh9Ij1Kl3Mn", "[REDACTED_API_KEY]"],
            ["r8_Ab3Cd5Ef7Gh9Ij1Kl3Mn", "[REDACTED_API_KEY]"],
            ["ste-Ab3Cd5Ef7Gh9Ij1Kl3Mn", "[REDACTED_API_KEY]"],
            ["abl_Ab3Cd5Ef7Gh9Ij1Kl3Mn", "[REDACTED_API_KEY]"],
            ["pplx-Ab3Cd5Ef7Gh9Ij1Kl3Mn", "[REDACTED_API_KEY]"],
            ["tk_Ab3Cd5Ef7Gh9Ij1Kl3Mn", "[REDACTED_API_KEY]"]
          ]
          # Every left neighbour a credential can follow, the harness's list. The first group is a
          # separator; the second ends in a letter, digit or mark (a serialization, a colour code, a
          # script written without spaces, a word glued on by a bug), which is why no left
          # boundary can be the test. A real newline and tab sit beside the escaped forms: a multi-line
          # message is a journald fact, and a key after its newline must still match. The start of
          # the text has its own test above.
          neighbours = [
            "key ", "key\n", "key\t", "key=", "key:", "\"", "OPENAI_KEY_", "x-", "/v1/keys/",
            "Bearer%20", "key%253D", "key=3D",
            "body\\n", "\\x22", "\\u0022", "\\U0001f600",
            "invalid key \u{1b}[33m", "API密钥", "APIキー", "Authorization:Bearer",
            "2026-11-03T10:00:00Z", "a", "é", "e\u{301}"
          ]
          sent = []
          expected = []
          for_each(keys) -> |_i, key| {
            for_each(neighbours) -> |_j, neighbour| {
              sent = push(sent, neighbour + string!(key[0]))
              expected = push(expected, neighbour + string!(key[1]))
            }
          }
          . = {
            "SYSLOG_IDENTIFIER": "basecradle-router",
            "message": join!(sent, " "),
            "expected": "[basecradle-router] " + join!(expected, " "),
            "count": length(sent)
          }
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              # Every key and every neighbour was sent: 17 keys after 24 neighbours.
              assert_eq!(.count, 408)
              assert_eq!(.message, .expected)

  # --- harness 0.186.0: a narrow run never swallows a key glued after it (basecradle-router#423) ---

  - name: "a narrow run glued straight onto a second key is redacted with it"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          # The harness's reproducers (basecradle-harness#858). Before the fix the first run took the
          # letters of the second key's prefix and stopped at its `_` or `-`, and the rest shipped:
          # `_q8m…`, `_Zx8…`, `-ant-api03-…` and `-Fab1cated…` after the first label.
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "a hf_Ab3Cd5Ef7Gh9Ij1Kl3Mntk_q8m2zr5wk1xt7nb4pv9hc3jd6fs0l b hf_Ab3Cd5Ef7Gh9Ij1Kl3Mnghp_Zx8Yw6Vu4Ts2Rq0Po9Nm7Lk5Ji3Hg1Fe c xai-Fab1catedXaiKey0001sk-ant-api03-Fab1catedKey0001xyz d github_pat_11ABCDEFG0Fab1catedPat_Fab1catedste-Fab1catedFab1catedFab1cated e"}
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              # `xai-` is narrow on this box (its run takes no `_` or `-`), so it gets the fix too.
              assert_eq!(.message, "[basecradle-router] a [REDACTED_API_KEY] b [REDACTED_API_KEY] c [REDACTED_API_KEY] d [REDACTED_GH_TOKEN] e")

  - name: "a third key glued onto the second goes with it"
    inputs:
      - insert_at: "ai_scrub"
        type: "vrl"
        source: |
          . = {"SYSLOG_IDENTIFIER": "basecradle-router", "message": "chain hf_Ab3Cd5Ef7Gh9Ij1Kl3Mnghp_Zx8Yw6Vu4Ts2Rq0Po9Nm7Lk5Ji3Hg1Feste-Fab1catedFab1catedFab1cated rejected"}
    outputs:

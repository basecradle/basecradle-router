# Vector unit tests for `ai_otel_llm` (basecradle-router#380, #384), run by tests/test_vector_otel_llm.py
# as `vector test <the shipped vector.yaml> <this file>`. Each event goes in at `ai_otel_llm` and is
# read back out of `ai_scrub`, the last transform before the logs sink, so the tests run the shipped
# VRL of both and assert the exact bytes Better Stack receives.
#
# Every input is a fabricated event in the exact shape Vector 0.56.0's `opentelemetry` source emits
# for a real Claude Code model call (2.1.316, captured 2026-11-01; `api_error` and
# `api_retries_exhausted` from 2.1.317, captured 2026-11-03; the status-less connection failure and
# deadline from 2.1.317, captured 2026-11-03 against loopback): the body is `.message`, the
# per-call fields are `.attributes`, and the NOC's `basecradle.agent` rides in `.resources`. The
# identifiers Claude Code attaches (session, user, account, prompt, terminal) are carried here as
# fabricated values on purpose, so the tests can prove that none of them ships.
#
# No dollar sign anywhere in this file: Vector interpolates environment variables across a test
# file just as it does across a config.

tests:
  - name: "a model call renders as the contract's llm line and nothing else"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_request",
            "attributes": {
              "event.name": "api_request",
              "event.sequence": 10,
              "event.timestamp": "2026-11-01T10:21:11.614Z",
              "model": "claude-opus-5-5",
              "input_tokens": 2,
              "output_tokens": 4,
              "cache_read_tokens": 11391,
              "cache_creation_tokens": 17868,
              "cache_creation_1h_tokens": 17868,
              "cache_creation_5m_tokens": 0,
              "cost_usd": 0.0036897099999999997,
              "cost_usd_micros": 3690,
              "duration_ms": 1508,
              "ttft_ms": 1492,
              "request_id": "req_011CgcFabricatedNova0001",
              "client_request_id": "0199a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2b",
              "query_source": "main",
              "speed": "normal",
              "effort": "medium",
              "basecradle.agent": "nova",
              "session.id": "0199a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2c",
              "prompt.id": "0199a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2d",
              "organization.id": "0199a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2e",
              "user.id": "f00dfab1cated0000000000000000000000000000000000000000000000000001",
              "user.account_id": "user_01FabricatedJohnDoe0000",
              "user.account_uuid": "0199a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2f",
              "user.email": "john@example.com",
              "terminal.type": "non-interactive"
            },
            "resources": {
              "basecradle.agent": "nova",
              "service.name": "claude-code",
              "service.version": "2.1.316",
              "host.arch": "amd64",
              "os.type": "linux"
            },
            "scope": {"name": "com.anthropic.claude_code.events", "version": "2.1.316"},
            "dropped_attributes_count": 0,
            "source_type": "opentelemetry",
            "observed_timestamp": t'2026-11-01T10:21:11.614Z',
            "timestamp": t'2026-11-01T10:21:11.614Z'
          }
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-wake-nova] INFO llm provider=anthropic purpose=main model=claude-opus-5-5 duration=1.51s tokens_in=29261 tokens_out=4 tokens_total=29265 cached_tokens=11391 cache_write_tokens=17868 cost=0.00368971 cost_basis=computed outcome=ok generation_id=req_011CgcFabricatedNova0001")
              assert_eq!(.SYSLOG_IDENTIFIER, "basecradle-wake-nova")
              assert_eq!(.host, get_hostname!())
              assert_eq!(.dt, t'2026-11-01T10:21:11.614Z')
              # The whole event is these four fields: no attribute, resource or scope survives.
              assert_eq!(keys(.), ["SYSLOG_IDENTIFIER", "dt", "host", "message"])

  - name: "an auxiliary call is a helper with no kind, string counters are read, and a zero cache write is omitted"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_request",
            "attributes": {
              "model": "claude-haiku-5-5",
              "input_tokens": "764942",
              "output_tokens": "236",
              "cache_read_tokens": "0",
              "cache_creation_tokens": "0",
              "cost_usd": "0.0445",
              "duration_ms": "42960",
              "request_id": "req_011CgcFabricatedNova0002",
              "query_source": "auxiliary"
            },
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:22:00Z'
          }
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-wake-nova] INFO llm provider=anthropic purpose=helper model=claude-haiku-5-5 duration=42.96s tokens_in=764942 tokens_out=236 tokens_total=765178 cached_tokens=0 cost=0.0445 cost_basis=computed outcome=ok generation_id=req_011CgcFabricatedNova0002")

  - name: "a subagent or sdk call is the builder's own work"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_request",
            "attributes": {
              "model": "claude-opus-5-5",
              "input_tokens": 10,
              "output_tokens": 5,
              "cost_usd": 2,
              "duration_ms": 5,
              "query_source": "sdk"
            },
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:23:00Z'
          }
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              # No cache read reported: no cached_tokens. No request id: no generation_id.
              assert_eq!(.message, "[basecradle-wake-nova] INFO llm provider=anthropic purpose=main model=claude-opus-5-5 duration=0.01s tokens_in=10 tokens_out=5 tokens_total=15 cost=2 cost_basis=computed outcome=ok")


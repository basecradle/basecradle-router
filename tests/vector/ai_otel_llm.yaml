          }
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              # Measured on Claude Code 2.1.317 against a loopback listener that never answered: no
              # status and no request id. Nothing answered, so its time is not stated as the call's.
              assert_eq!(.message, "[basecradle-wake-nova] WARNING llm provider=anthropic purpose=main model=claude-opus-5-5 outcome=failed reason=timeout detail=\"Request timed out.\"")


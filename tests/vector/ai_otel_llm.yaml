            source: |
              assert_eq!(.message, "[basecradle-wake-nova] WARNING llm provider=anthropic purpose=main model=claude-opus-5-5 outcome=failed reason=payload_too_large detail=\"Request Too Large\"")

  - name: "foreign error text is flattened, quoted, and redacted, and cannot forge a field"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_error",
            "attributes": {
              "model": "claude-opus-5-5",
              "error": "upstream said:\n\t" + decode_base64!("Gw==") + "[31m \"outcome=ok\"   x-api-key: sk-ant-api03-FabricatedNovaKey0000000000\r\n",
              "status_code": 500,
              "query_source": "main"
            },
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:27:10Z'
          }
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              # One record, one line; the double quotes inside are single quotes, so the only
              # outcome= outside a quoted value is the line's own.
              assert_eq!(.message, "[basecradle-wake-nova] WARNING llm provider=anthropic purpose=main model=claude-opus-5-5 outcome=failed reason=server_error detail=\"upstream said: [31m 'outcome=ok' x-api-key: [REDACTED_API_KEY]\"")

  - name: "a long error text is never cut inside a credential, so none ships short of its redaction"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          # 228 characters of words and `x `, then a full-length GitHub token straddling the
          # 239-character cut: a cut inside it would leave `ghp_Fabri`, which is too short for the
          # redaction to match.
          words = "lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem "
          . = {
            "message": "claude_code.api_error",
            "attributes": {
              "model": "claude-opus-5-5",
              "error": words + "x ghp_FabricatedNovaToken00000000000000000 and the rest of a long upstream body",
              "status_code": 502,
              "query_source": "main"
            },
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:27:20Z'
          }
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              words = "lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem lorem "
              assert_eq!(.message, "[basecradle-wake-nova] WARNING llm provider=anthropic purpose=main model=claude-opus-5-5 outcome=failed reason=server_error detail=\"" + words + "x…\"")
              assert!(!contains(string!(.message), "ghp_"))

  - name: "an error body with no spaces is cut at its last character outside a credential charset"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_error",
            "attributes": {
              "model": "claude-opus-5-5",
              "error": "{\"type\":\"error\",\"error\":{\"type\":\"invalid_request_error\",\"message\":\"prompt_is_too_long:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\"}}",
              "status_code": 400,
              "query_source": "main"
            },
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:27:25Z'
          }
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-wake-nova] WARNING llm provider=anthropic purpose=main model=claude-opus-5-5 outcome=failed reason=api_error detail=\"{'type':'error','error':{'type':'invalid_request_error','message':'prompt_is_too_long:…\"")

  - name: "an error text that is one credential-charset run past the bound is omitted"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          blob = ""
          . = {
            "message": "claude_code.api_error",
            "attributes": {"model": "claude-opus-5-5", "error": blob, "status_code": 400, "query_source": "main"},
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:27:30Z'
          }
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-wake-nova] WARNING llm provider=anthropic purpose=main model=claude-opus-5-5 outcome=failed reason=api_error")

  - name: "api_retries_exhausted writes no line, so a failure is counted once"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_retries_exhausted",
            "attributes": {
              "model": "claude-haiku-5-5",
              "error": "Overloaded",
              "status_code": 503,
              "total_attempts": 3,
              "total_retry_duration_ms": 1640,
              "query_source": "sdk"
            },
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:27:40Z'
          }
    no_outputs_from: ["ai_otel_llm", "ai_scrub"]

  - name: "an api_error with a model id outside the charset is dropped"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_error",
            "attributes": {"model": "claude-opus-5-5 outcome=ok", "error": "x", "status_code": 500},
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:27:50Z'
          }
    no_outputs_from: ["ai_otel_llm", "ai_scrub"]

  - name: "a foreign Claude Code event is dropped whole"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.user_prompt",
            "attributes": {"prompt": "Fabricated prompt from John Doe.", "prompt_length": 32},
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:27:00Z'
          }
    no_outputs_from: ["ai_otel_llm", "ai_scrub"]

  - name: "a slug outside the charset is dropped"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_request",
            "attributes": {"model": "claude-opus-5-5", "input_tokens": 1, "output_tokens": 1},
            "resources": {"basecradle.agent": "Nova Digital] INFO llm provider=forged"},
            "timestamp": t'2026-11-01T10:28:00Z'
          }
    no_outputs_from: ["ai_otel_llm", "ai_scrub"]

  - name: "a missing slug is dropped"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_request",
            "attributes": {"model": "claude-opus-5-5", "input_tokens": 1, "output_tokens": 1, "basecradle.agent": "nova"},
            "resources": {"service.name": "claude-code"},
            "timestamp": t'2026-11-01T10:29:00Z'
          }
    no_outputs_from: ["ai_otel_llm", "ai_scrub"]

  - name: "a model id outside the charset is dropped"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_request",
            "attributes": {"model": "claude-opus-5-5 cost=0", "input_tokens": 1, "output_tokens": 1},
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:30:00Z'
          }
    no_outputs_from: ["ai_otel_llm", "ai_scrub"]

  - name: "a key-shaped value the charsets admit is still redacted by the box's scrub"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_request",
            "attributes": {
              "model": "sk-ant-api03-FabricatedNovaKey0000000000",
              "input_tokens": 1,
              "output_tokens": 1,
              "request_id": "ghp_FabricatedNovaToken000000000000000",
              "query_source": "main"
            },
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:31:00Z'
          }
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-wake-nova] INFO llm provider=anthropic purpose=main model=[REDACTED_API_KEY] tokens_in=1 tokens_out=1 tokens_total=2 outcome=ok generation_id=[REDACTED_GH_TOKEN]")

  - name: "a counter at the integer ceiling is not stated, never wrapped negative"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_request",
            "attributes": {
              "model": "claude-opus-5-5",
              "input_tokens": 9223372036854775807,
              "output_tokens": 1,
              "cache_read_tokens": 5,
              "query_source": "main"
            },
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:32:00Z'
          }
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-wake-nova] INFO llm provider=anthropic purpose=main model=claude-opus-5-5 tokens_in=5 tokens_out=1 tokens_total=6 cached_tokens=5 outcome=ok")

            source: |
              assert_eq!(.message, "[basecradle-wake-nova] INFO llm provider=anthropic purpose=main model=claude-opus-5-5 tokens_in=100 tokens_out=20 tokens_total=120 outcome=ok")

  - name: "an api_error renders as a failed llm line and nothing else"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_error",
            "attributes": {
              "event.name": "api_error",
              "event.sequence": 6,
              "event.timestamp": "2026-11-01T10:26:00.317Z",
              "model": "claude-opus-5-5",
              "error": "model: claude-opus-5-5",
              "status_code": 404,
              "duration_ms": 317,
              "attempt": 1,
              "request_id": "req_011CgcFabricatedNova0004",
              "query_source": "main",
              "speed": "normal",
              "effort": "high",
              "session.id": "0199a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2c",
              "prompt.id": "0199a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2d",
              "user.account_uuid": "0199a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2f",
              "user.email": "john@example.com",
              "terminal.type": "non-interactive"
            },
            "resources": {"basecradle.agent": "nova", "service.name": "claude-code"},
            "source_type": "opentelemetry",
            "timestamp": t'2026-11-01T10:26:00.317Z'
          }
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              # A decision line: WARNING, no tokens, no cost, no attempt. One attempt that reached
              # Anthropic, so its time is the whole wait and is written. A 404 is the contract's
              # `config:model_not_found` (Fault Slugs, basecradle-harness#786).
              assert_eq!(.message, "[basecradle-wake-nova] WARNING llm provider=anthropic purpose=main model=claude-opus-5-5 duration=0.32s outcome=failed reason=config:model_not_found detail=\"model: claude-opus-5-5\" generation_id=req_011CgcFabricatedNova0004")
              assert_eq!(.dt, t'2026-11-01T10:26:00.317Z')
              assert_eq!(keys(.), ["SYSLOG_IDENTIFIER", "dt", "host", "message"])


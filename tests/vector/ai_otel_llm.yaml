  - name: "a call that ran out of Claude Code's own deadline is timeout, never transport, with no duration"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_error",
            "attributes": {"model": "claude-opus-5-5", "error": "Request timed out.", "duration_ms": 2007, "attempt": 1, "query_source": "sdk"},

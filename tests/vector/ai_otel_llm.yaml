# Vector unit tests for `ai_otel_llm` (basecradle-router#380), run by tests/test_vector_otel_llm.py
# as `vector test <the shipped vector.yaml> <this file>`. Each event goes in at `ai_otel_llm` and is
# read back out of `ai_scrub`, the last transform before the logs sink, so the tests run the shipped
# VRL of both and assert the exact bytes Better Stack receives.
#
# Every input is a fabricated event in the exact shape Vector 0.56.0's `opentelemetry` source emits
# for a real Claude Code 2.1.316 model call (captured 2026-11-01): the body is `.message`, the
# per-call fields are `.attributes`, and the NOC's `basecradle.agent` rides in `.resources`. The
# identifiers Claude Code attaches (session, user, account, prompt, terminal) are carried here as
# fabricated values on purpose, so the tests can prove that none of them ships.
#
# No dollar sign anywhere in this file: Vector interpolates environment variables across a test
# file just as it does across a config.

tests:
  - name: "a model call renders as the contract's llm line and nothing else"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_request",
            "attributes": {
              "event.name": "api_request",
              "event.sequence": 10,
              "event.timestamp": "2026-11-01T10:21:11.614Z",
              "model": "claude-opus-5-5",
              "input_tokens": 2,
              "output_tokens": 4,
              "cache_read_tokens": 11391,
              "cache_creation_tokens": 17868,
              "cache_creation_1h_tokens": 17868,
              "cache_creation_5m_tokens": 0,
              "cost_usd": 0.0036897099999999997,
              "cost_usd_micros": 3690,
              "duration_ms": 1508,
              "ttft_ms": 1492,
              "request_id": "req_011CgcFabricatedNova0001",
              "client_request_id": "0199a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2b",
              "query_source": "main",
              "speed": "normal",
              "effort": "medium",
              "basecradle.agent": "nova",
              "session.id": "0199a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2c",
              "prompt.id": "0199a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2d",
              "organization.id": "0199a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2e",
              "user.id": "f00dfab1cated0000000000000000000000000000000000000000000000000001",
              "user.account_id": "user_01FabricatedJohnDoe0000",
              "user.account_uuid": "0199a1b2-c3d4-7e5f-8a6b-7c8d9e0f1a2f",
              "user.email": "john@example.com",
              "terminal.type": "non-interactive"
            },
            "resources": {
              "basecradle.agent": "nova",
              "service.name": "claude-code",
              "service.version": "2.1.316",
              "host.arch": "amd64",
              "os.type": "linux"
            },
            "scope": {"name": "com.anthropic.claude_code.events", "version": "2.1.316"},
            "dropped_attributes_count": 0,
            "source_type": "opentelemetry",
            "observed_timestamp": t'2026-11-01T10:21:11.614Z',
            "timestamp": t'2026-11-01T10:21:11.614Z'
          }
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-wake-nova] INFO llm provider=anthropic purpose=main model=claude-opus-5-5 duration=1.51s tokens_in=29261 tokens_out=4 tokens_total=29265 cached_tokens=11391 cache_write_tokens=17868 cost=0.00368971 cost_basis=computed generation_id=req_011CgcFabricatedNova0001")
              assert_eq!(.SYSLOG_IDENTIFIER, "basecradle-wake-nova")
              assert_eq!(.host, get_hostname!())
              assert_eq!(.dt, t'2026-11-01T10:21:11.614Z')
              # The whole event is these four fields: no attribute, resource or scope survives.
              assert_eq!(keys(.), ["SYSLOG_IDENTIFIER", "dt", "host", "message"])

  - name: "an auxiliary call is a helper, string counters are read, and a zero cache write is omitted"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_request",
            "attributes": {
              "model": "claude-haiku-5-5",
              "input_tokens": "764942",
              "output_tokens": "236",
              "cache_read_tokens": "0",
              "cache_creation_tokens": "0",
              "cost_usd": "0.0445",
              "duration_ms": "42960",
              "request_id": "req_011CgcFabricatedNova0002",
              "query_source": "auxiliary"
            },
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:22:00Z'
          }
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-wake-nova] INFO llm provider=anthropic purpose=helper model=claude-haiku-5-5 duration=42.96s tokens_in=764942 tokens_out=236 tokens_total=765178 cached_tokens=0 cost=0.0445 cost_basis=computed generation_id=req_011CgcFabricatedNova0002")

  - name: "a subagent or sdk call is the builder's own work"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_request",
            "attributes": {
              "model": "claude-opus-5-5",
              "input_tokens": 10,
              "output_tokens": 5,
              "cost_usd": 2,
              "duration_ms": 5,
              "query_source": "sdk"
            },
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:23:00Z'
          }
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              # No cache read reported: no cached_tokens. No request id: no generation_id.
              assert_eq!(.message, "[basecradle-wake-nova] INFO llm provider=anthropic purpose=main model=claude-opus-5-5 duration=0.01s tokens_in=10 tokens_out=5 tokens_total=15 cost=2 cost_basis=computed")

  - name: "a usage block of nothing but zeros writes no tokens and no zero cost"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_request",
            "attributes": {
              "model": "claude-opus-5-5",
              "input_tokens": 0,
              "output_tokens": 0,
              "cache_read_tokens": 0,
              "cache_creation_tokens": 0,
              "cost_usd": 0,
              "duration_ms": 120000,
              "request_id": "req_011CgcFabricatedNova0003",
              "query_source": "main"
            },
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:24:00Z'
          }
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-wake-nova] INFO llm provider=anthropic purpose=main model=claude-opus-5-5 duration=120.00s generation_id=req_011CgcFabricatedNova0003")

  - name: "a negative cost, a malformed counter and a malformed request id are omitted, never shipped"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_request",
            "attributes": {
              "model": "claude-opus-5-5",
              "input_tokens": 100,
              "output_tokens": 20,
              "cache_read_tokens": "12 tokens",
              "cost_usd": -0.5,
              "duration_ms": -3,
              "request_id": "req_011 Cgc=Fabricated",
              "query_source": "main"
            },
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:25:00Z'
          }
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-wake-nova] INFO llm provider=anthropic purpose=main model=claude-opus-5-5 tokens_in=100 tokens_out=20 tokens_total=120")

  - name: "an api_error writes no llm line"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_error",
            "attributes": {
              "model": "claude-opus-5-5",
              "error": "model: claude-opus-5-5",
              "status_code": 404,
              "duration_ms": 317,
              "attempt": 1,
              "request_id": "req_011CgcFabricatedNova0004",
              "query_source": "main"
            },
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:26:00Z'
          }
    no_outputs_from: ["ai_otel_llm", "ai_scrub"]

  - name: "a foreign Claude Code event is dropped whole"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.user_prompt",
            "attributes": {"prompt": "Fabricated prompt from John Doe.", "prompt_length": 32},
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:27:00Z'
          }
    no_outputs_from: ["ai_otel_llm", "ai_scrub"]

  - name: "a slug outside the charset is dropped"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_request",
            "attributes": {"model": "claude-opus-5-5", "input_tokens": 1, "output_tokens": 1},
            "resources": {"basecradle.agent": "Nova Digital] INFO llm provider=forged"},
            "timestamp": t'2026-11-01T10:28:00Z'
          }
    no_outputs_from: ["ai_otel_llm", "ai_scrub"]

  - name: "a missing slug is dropped"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_request",
            "attributes": {"model": "claude-opus-5-5", "input_tokens": 1, "output_tokens": 1, "basecradle.agent": "nova"},
            "resources": {"service.name": "claude-code"},
            "timestamp": t'2026-11-01T10:29:00Z'
          }
    no_outputs_from: ["ai_otel_llm", "ai_scrub"]

  - name: "a model id outside the charset is dropped"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_request",
            "attributes": {"model": "claude-opus-5-5 cost=0", "input_tokens": 1, "output_tokens": 1},
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:30:00Z'
          }
    no_outputs_from: ["ai_otel_llm", "ai_scrub"]

  - name: "a key-shaped value the charsets admit is still redacted by the box's scrub"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_request",
            "attributes": {
              "model": "sk-ant-api03-FabricatedNovaKey0000000000",
              "input_tokens": 1,
              "output_tokens": 1,
              "request_id": "ghp_FabricatedNovaToken000000000000000",
              "query_source": "main"
            },
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:31:00Z'
          }
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-wake-nova] INFO llm provider=anthropic purpose=main model=[REDACTED_API_KEY] tokens_in=1 tokens_out=1 tokens_total=2 generation_id=[REDACTED_GH_TOKEN]")

  - name: "a counter at the integer ceiling is not stated, never wrapped negative"
    inputs:
      - insert_at: "ai_otel_llm"
        type: "vrl"
        source: |
          . = {
            "message": "claude_code.api_request",
            "attributes": {
              "model": "claude-opus-5-5",
              "input_tokens": 9223372036854775807,
              "output_tokens": 1,
              "cache_read_tokens": 5,
              "query_source": "main"
            },
            "resources": {"basecradle.agent": "nova"},
            "timestamp": t'2026-11-01T10:32:00Z'
          }
    outputs:
      - extract_from: "ai_scrub"
        conditions:
          - type: "vrl"
            source: |
              assert_eq!(.message, "[basecradle-wake-nova] INFO llm provider=anthropic purpose=main model=claude-opus-5-5 tokens_in=5 tokens_out=1 tokens_total=6 cached_tokens=5")

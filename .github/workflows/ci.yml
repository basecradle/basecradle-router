name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job id is the published check-run name, and the "Protect main" ruleset
  # requires the status context "CI" — so this job must be named CI (not the
  # workflow's `name:`, which GitHub does not use as the required context).
  CI:
    # PINNED TO THE BOXES' OS (#404), like uv and Vector below. Both fleet servers run
    # Ubuntu 24.04; `ubuntu-latest` moved to 26.04, whose sudo is sudo-rs, so the
    # real-process-tree step below would prove the stop against a sudo no box runs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the commit-trailer guard walks base..head, and both ends
          # must be in the clone. The repo is small, so every event pays it.
          fetch-depth: 0

      - name: Injection-Marker Guard
        run: .github/scripts/injection-guard.sh

      # Fleet Bot Identity: a commit authored by this repo's bot carries no
      # Co-Authored-By trailer (#354). A STEP in this job, like Shell Lint below, so
      # the required context stays the single `CI`. Gated on the event because only
      # a PR's own commits can still be rewritten; main's squash commits never can.
      - name: Commit Trailers
        if: github.event_name == 'pull_request'
        env:
          BOT: basecradle-router-ai[bot]
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/commit-trailers.sh

      # Shell was the unlinted half of this repo (#299): the root-run wake path and
      # the reboot helper had no gate while Python had two. `shellcheck` is
      # preinstalled on the runner image, so this is ~1s and no install step. A STEP
      # in this job, not a job of its own, so the required status context stays the
      # single `CI` above and no ruleset change is needed.
      - name: Shell Lint
        run: .github/scripts/lint-shell.sh

      # PINNED TO THE BOX'S uv (#297, #447). Every router host runs uv 0.13.7 (the
      # NOC's `ROUTER_UV_VERSION`, basecradle-noc#1411), and the deploy's lock gate
      # (`uv sync --locked` as `router`) runs under THAT resolver.
      # Unpinned, this step installs whatever uv is newest, so CI could green a lock
      # the box's uv disagrees with — and the disagreement would surface as a failed
      # deploy on the fleet's only wake path instead of a red check here. Read the
      # box's version from the NOC's `introspect-router` and move this pin with it;
      # a pin gone stale is the safe direction (an older resolver cannot write a lock
      # a newer one refuses).
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"

      - name: Set Up Python
        run: uv python install 3.10

      # `--locked`, NOT `--frozen` (#297). `--frozen` installs from `uv.lock` and never
      # compares it to `pyproject.toml`, so a commit whose lock is stale used to reach
      # `main` green and then fail the deploy at the box's own `uv sync --locked`.
      # This is the SAME command the deploy runs, so CI cannot pass what the box will
      # reject.
      - name: Install Dependencies (Asserts uv.lock Is Current)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format Check
        run: uv run ruff format --check .

      # THE BOXES' VECTOR (#380). tests/test_vector_unit.py runs the shipped vector.yaml's
      # VRL through `vector test`, so it must run on the release the boxes install
      # (deploy/README → VECTOR_VERSION, which that test holds this pin to). The same .deb the
      # boxes install, checksum-verified, and only unpacked: no service, no root, nothing on
      # PATH but this job's own copy.
      - name: Install Vector
        env:
          VECTOR_VERSION: "0.61.0"
          VECTOR_DEB_SHA256: "1cf2bc77f865e05e539c177feb0eb5feee20ee2762ea379f101610c9625fc4b8"
        run: |
          deb="$RUNNER_TEMP/vector.deb"
          curl -fsSL -o "$deb" "https://github.com/vectordotdev/vector/releases/download/v${VECTOR_VERSION}/vector_${VECTOR_VERSION}-1_amd64.deb"
          echo "${VECTOR_DEB_SHA256}  $deb" | sha256sum -c -
          dpkg-deb -x "$deb" "$RUNNER_TEMP/vector"
          echo "VECTOR_BIN=$RUNNER_TEMP/vector/usr/bin/vector" >> "$GITHUB_ENV"

      - name: Test
        run: uv run pytest

      # THE REAL PROCESS TREE (#404). tests/test_stop_wake_tree.py stops a real
      # `sudo -> runuser -> <binary>` wake with the real stop-wake, which takes root; the
      # step above runs as `runner`, where it skips. Here it runs as root on the job's
      # pinned Ubuntu 24.04 (the boxes' sudo and util-linux), and STOP_WAKE_TREE_REQUIRED
      # turns a skip — or a sudo that is not the boxes' kind — into a failure, so the proof
      # cannot go green by not running, nor by running against the wrong sudo. No bytecode and
      # no cache, so root writes nothing into the checkout. A STEP, so the required status
      # context stays the single `CI`.
      - name: Stop-Wake Against a Real Process Tree (Root)
        run: >-
          sudo env PATH="$PATH" STOP_WAKE_TREE_REQUIRED=1 PYTHONDONTWRITEBYTECODE=1
          .venv/bin/python -m pytest -p no:cacheprovider tests/test_stop_wake_tree.py

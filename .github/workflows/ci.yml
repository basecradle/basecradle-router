name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job id is the published check-run name, and the "Protect main" ruleset
  # requires the status context "CI" — so this job must be named CI (not the
  # workflow's `name:`, which GitHub does not use as the required context).
  CI:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Injection-marker guard
        run: .github/scripts/injection-guard.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

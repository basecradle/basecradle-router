name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, like every other workflow here: CI only reads the repository, so its
# GITHUB_TOKEN never takes the repository's default scope.
permissions:
  contents: read

jobs:
  # Job id is the published check-run name, and the "Protect main" ruleset
  # requires the status context "CI" — so this job must be named CI (not the
  # workflow's `name:`, which GitHub does not use as the required context).
  CI:
    # PINNED TO THE BOXES' OS (#404), like uv and Vector below. Both fleet servers run
    # Ubuntu 24.04; `ubuntu-latest` moved to 26.04, whose sudo is sudo-rs, so the
    # real-process-tree step below would prove the stop against a sudo no box runs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the commit-trailer guard walks base..head, and both ends
          # must be in the clone. The repo is small, so every event pays it.
          fetch-depth: 0

      - name: Injection-Marker Guard
        run: .github/scripts/injection-guard.sh

      # A workflow GitHub cannot parse has no triggers and never runs, and nothing else here
      # reads one: the Public Repository Lockdown merged as invalid YAML with this job green
      # (#449). actionlint parses every workflow, checks it against GitHub's schema, and
      # shellchecks its `run:` scripts. Pinned by version AND checksum (the release's own
      # actionlint_<version>_checksums.txt, which matches GitHub's asset digest), like Vector
      # below. Dependabot does not see a download, so a bump is by hand. A STEP, so the
      # required status context stays the single `CI`.
      - name: Workflow Lint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 --max-time 120 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $archive" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          PATH="$RUNNER_TEMP/actionlint:$PATH" .github/scripts/lint-workflows.sh

      # Fleet Bot Identity: a commit authored by this repo's bot carries no
      # Co-Authored-By trailer (#354). A STEP in this job, like Shell Lint below, so
      # the required context stays the single `CI`. Gated on the event because only
      # a PR's own commits can still be rewritten; main's squash commits never can.
      - name: Commit Trailers
        if: github.event_name == 'pull_request'
        env:
          BOT: basecradle-router-ai[bot]
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/commit-trailers.sh

      # Shell was the unlinted half of this repo (#299): the root-run wake path and
      # the reboot helper had no gate while Python had two. `shellcheck` is
      # preinstalled on the runner image, so this is ~1s and no install step. A STEP
      # in this job, not a job of its own, so the required status context stays the
      # single `CI` above and no ruleset change is needed.
      - name: Shell Lint
        run: .github/scripts/lint-shell.sh

      # PINNED TO THE BOX'S uv (#297, #447). Every router host runs uv 0.13.7 (the
      # NOC's `ROUTER_UV_VERSION`, basecradle-noc#1411), and the deploy's lock gate
      # (`uv sync --locked` as `router`) runs under THAT resolver.
      # Unpinned, this step installs whatever uv is newest, so CI could green a lock
      # the box's uv disagrees with — and the disagreement would surface as a failed
      # deploy on the fleet's only wake path instead of a red check here. Read the
      # box's version from the NOC's `introspect-router` and move this pin with it;
      # a pin gone stale is the safe direction (an older resolver cannot write a lock
      # a newer one refuses).
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"

      - name: Set Up Python
        run: uv python install 3.10

      # `--locked`, NOT `--frozen` (#297). `--frozen` installs from `uv.lock` and never
      # compares it to `pyproject.toml`, so a commit whose lock is stale used to reach
      # `main` green and then fail the deploy at the box's own `uv sync --locked`.
      # This is the SAME command the deploy runs, so CI cannot pass what the box will
      # reject.
      - name: Install Dependencies (Asserts uv.lock Is Current)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format Check
        run: uv run ruff format --check .

      # ruff finds Python by extension, so the two steps above never open the extensionless
      # helpers under deploy/bin that the NOC installs root-owned on the box; CLAUDE.md's Stack
      # holds all of this repo's Python to ruff, and these had drifted from it unseen (found in
      # #484's review). This lints them, discovered by shebang
      # (tests/test_lint_python_scripts_gate.py).
      - name: Lint Python Scripts
        run: uv run .github/scripts/lint-python-scripts.sh

      # THE BOXES' VECTOR (#380). tests/test_vector_unit.py runs the shipped vector.yaml's
      # VRL through `vector test`, so it must run on the release the boxes install
      # (deploy/README → VECTOR_VERSION, which that test holds this pin to). The same .deb the
      # boxes install, checksum-verified, and only unpacked: no service, no root, nothing on
      # PATH but this job's own copy.
      - name: Install Vector
        env:
          VECTOR_VERSION: "0.61.0"
          VECTOR_DEB_SHA256: "1cf2bc77f865e05e539c177feb0eb5feee20ee2762ea379f101610c9625fc4b8"
        run: |
          deb="$RUNNER_TEMP/vector.deb"
          curl -fsSL -o "$deb" "https://github.com/vectordotdev/vector/releases/download/v${VECTOR_VERSION}/vector_${VECTOR_VERSION}-1_amd64.deb"
          echo "${VECTOR_DEB_SHA256}  $deb" | sha256sum -c -
          dpkg-deb -x "$deb" "$RUNNER_TEMP/vector"
          echo "VECTOR_BIN=$RUNNER_TEMP/vector/usr/bin/vector" >> "$GITHUB_ENV"

      # THE HARNESS'S SCRUB (#516). tests/test_scrub_differential.py holds the box's ai_scrub and
      # the print site to the harness's own scrub, at the release the fleet runs (the pin in
      # tests/scrub_differential.py, which that test holds this step to). Only the wheel is
      # fetched, pinned by version AND checksum like Vector above, and never installed:
      # tests/harness_scrub.py verifies the bytes again and runs two of its modules from the zip
      # under the runner's own Python 3.12 (the harness needs 3.11 or later; the router runs on
      # 3.10). It is not a locked dependency, so nothing of it reaches a box. Move the pin with
      # the fleet's harness roll; Dependabot does not see a download.
      - name: Fetch the Harness's Scrub
        env:
          HARNESS_VERSION: "0.198.4"
          HARNESS_WHEEL_SHA256: "ba0741a2302ccf97b122679324e6ebe6bde903b6d10813ce628bef421ed49aa1"
        run: |
          set -euo pipefail
          wheel="$RUNNER_TEMP/basecradle_harness-${HARNESS_VERSION}-py3-none-any.whl"
          curl -fsSL --retry 3 --max-time 120 -o "$wheel" \
            "https://files.pythonhosted.org/packages/py3/b/basecradle_harness/basecradle_harness-${HARNESS_VERSION}-py3-none-any.whl"
          echo "${HARNESS_WHEEL_SHA256}  $wheel" | sha256sum --check --strict -
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
          {
            echo "HARNESS_WHEEL=$wheel"
            echo "HARNESS_PYTHON=$(command -v python3)"
          } >> "$GITHUB_ENV"

      - name: Test
        run: uv run pytest

      # THE REAL PROCESS TREE (#404). tests/test_stop_wake_tree.py stops a real
      # `sudo -> runuser -> <binary>` wake with the real stop-wake, which takes root; the
      # step above runs as `runner`, where it skips. Here it runs as root on the job's
      # pinned Ubuntu 24.04 (the boxes' sudo and util-linux), and STOP_WAKE_TREE_REQUIRED
      # turns a skip — or a sudo that is not the boxes' kind — into a failure, so the proof
      # cannot go green by not running, nor by running against the wrong sudo. No bytecode and
      # no cache, so root writes nothing into the checkout. A STEP, so the required status
      # context stays the single `CI`.
      - name: Stop-Wake Against a Real Process Tree (Root)
        run: >-
          sudo env PATH="$PATH" STOP_WAKE_TREE_REQUIRED=1 PYTHONDONTWRITEBYTECODE=1
          .venv/bin/python -m pytest -p no:cacheprovider tests/test_stop_wake_tree.py

      # THE SEALED WAKE, AS ROOT (#535). tests/test_sealed_wake_root.py runs the whole real
      # wake-runner and set-wake-bin against root-owned trees built from real uv environments,
      # through the real privilege drop, which takes root; the Test step above skips it. Each
      # box is built in a private mount namespace on tmpfs-backed overlays, so nothing reaches
      # the runner's own /etc, /opt or /home. SEALED_WAKE_ROOT_REQUIRED turns a skip, a real
      # wake included (it needs the runner's journal), into a failure. A STEP, so the required
      # status context stays the single `CI`.
      - name: Sealed Harness Wake (Root)
        run: >-
          sudo env PATH="$PATH" SEALED_WAKE_ROOT_REQUIRED=1 PYTHONDONTWRITEBYTECODE=1
          .venv/bin/python -m pytest -p no:cacheprovider tests/test_sealed_wake_root.py

[project]
name = "basecradle-router"
version = "0.0.0"
description = "The fleet router for BaseCradle — a modular webhook daemon that wakes the right agent on an event."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.21",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basecradle_router"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

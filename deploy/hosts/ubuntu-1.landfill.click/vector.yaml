# BaseCradle router (ai.basecradle.com) — Better Stack Vector config
# (telemetry: host metrics + scrubbed journald).
#
# Canonical, version-controlled config for the router box. It mirrors basecradle-noc's proven,
# security-hardened config (basecradle-noc#31 enabled telemetry; basecradle-noc#33 / basecradle#338
# hardened the scrub after an unscrubbed-journald secret leak). First install and the full contract:
# deploy/README "Part 5 — Telemetry".
#
# HOW A MERGE REACHES THE BOX (basecradle-noc#677 / #680) — unattended, with no human, in one NOC
# `auto-converge` tick. The tick's router deploy mirrors this file into the deployed tree, and the same
# tick installs it to /etc/vector/vector.yaml with the NOC's `deploy-vector` op (validate, install,
# restart, roll back on failure, read the landing back) — but ONLY while the installed copy is still
# byte-identical to this file's copy in the previously deployed router tree, i.e. what the NOC last
# shipped. Any other state holds the apply: a box-only edit to /etc/vector/vector.yaml is never
# overwritten, and it stays a red `config_diverged` drift finding for a human. So a change made only
# on the box is never durable — it holds every later apply until the same change lands here.
#
# NO DOLLAR SIGN IN ANY COMMENT. Vector interpolates environment variables across the whole file
# before it parses the YAML, so comments are NOT exempt: a dollar sign in a comment can fail the NOC's
# pre-install validation, and the apply is refused. Write "dollar sign" in words. The two sink
# `token:` values at the bottom are the only dollar signs this file carries.
#
# Tailored to this box (a webhook daemon + Caddy, no database), so the generated kitchen-sink config
# (apache/nginx/mysql/mongo/redis/postgres log + metric sources scraping absent localhost endpoints)
# is replaced with exactly what this box has:
#   * journald         — ALL system logs AND the router's own software: the basecradle-router.service
#                        uvicorn daemon and the drift/reboot/recovery units all log to the journal via
#                        stdout/stderr. journald (not a /var/log/*.log tail) catches /var/log/syslog too.
#   * host_metrics     — CPU / memory / disk / load / network.
#   * internal_metrics — Vector's OWN health counters (basecradle-noc#215), exposed on a localhost-only
#                        prometheus endpoint and PULLED out-of-band by the NOC. Never shipped to Better
#                        Stack: a broken transport cannot ship the metric that says it is broken.
#   * opentelemetry    — the Claude Code builders' model calls (basecradle-router#380), received on
#                        localhost and rendered by `ai_otel_llm` as the fleet's own `llm` line, so the
#                        builders land on the same board as every harness agent.
#
# SECURITY — never ship raw journald to an external store (basecradle-noc#33 / basecradle#338).
# The `ai_scrub` transform runs before the logs sink and:
#   * DROPS whole events from `sudo` (PAM logs the full argv — any secret passed on a command
#     line lands here; the router escalates a wake via `sudo -> wake-runner`, so this matters) and
#     from Vector itself (its own logs can echo the sink token via component ids/config — this is
#     how the source token leaked ~40x on the NOC box);
#   * DELETES `_CMDLINE` from EVERY event — journald attaches the emitting process's full argv as
#     a metadata FIELD, which no message-level redaction reaches (basecradle-noc#443);
#   * REDACTS secret-shaped patterns (GitHub tokens, `Bearer` creds, `/heartbeat/` URLs, `bc_uat_`
#     user tokens, `bc_isk_` integration signing keys, provider API keys — `sk-…`, `xai-…`,
#     `AIza…` and kin — Steel's `ste-…` keys plus any `apiKey=` query value, and refuseless
#     `abl_…`, Perplexity `pplx-…` and ntfy `tk_…`) from the message as defense in depth.
#
# The `_CMDLINE` deletion is UNCONDITIONAL — the guard is on the field, never on an allow-list of
# identifiers known to be dangerous. The `sudo` drop above was written as if `sudo` were *the* argv
# carrier on this box; it is not, and `runuser` is what got past it (basecradle-noc#443). The
# reasoning is at the rule itself, in the transform below.
#
# PRESENTATION (basecradle-router#170) — the `ai_scrub` transform also PREFIXES each shipped message
# with its journald `SYSLOG_IDENTIFIER`, so a Better Stack Live Tail line reads `[basecradle-router] …`
# or `[basecradle-wake-nova] …` and says which program on the box emitted it. Doing it HERE, once, is what
# makes it uniform: every program on the box gets the prefix for free, whereas hand-prefixing `[Router]`
# into the daemon's own log strings would cover only the daemon (never sshd, Caddy, or a wake) and would
# bake a presentation concern into application code. The identifier is journald's, so it is only as good
# as the program's name — which is why basecradle-router.service now sets `SyslogIdentifier=` (before
# that, the daemon's lines were stamped `uv`, the name of its *launcher*).
#
# The source ingest token is NOT in this file — the sinks interpolate it from the
# BETTERSTACK_AI_SOURCE_TOKEN environment variable, supplied to vector.service via the chmod-640
# EnvironmentFile /etc/vector/betterstack.env (a systemd drop-in), so the secret never lives in the
# repo or the YAML, and a rotation is a one-line swap of that env file.

sources:
  ai_journald:
    type: "journald"
    current_boot_only: true

  ai_host_metrics:
    type: "host_metrics"
    scrape_interval_secs: 30
    collectors: [cpu, disk, filesystem, load, host, memory, network]
    # Don't scrape what we cannot read (basecradle#414). The `filesystem` collector stats every
    # mount in /proc/mounts, and `/sys/kernel/debug/tracing` (tracefs, under a 0700 debugfs) is
    # unreadable by the unprivileged `vector` user — so every 30s scrape logged an ERROR
    # (`statvfs`: permission denied), ~2,880/day, training a human reading the box's journal in an
    # incident to skim past ERROR. Excluding by filesystem *type* rather than by mountpoint path
    # is deliberate: tracefs is mounted at both /sys/kernel/tracing and /sys/kernel/debug/tracing,
    # and the type is the durable fact — these are pseudo-filesystems with no capacity to report,
    # so their usage metrics were never wanted. The exclude is checked before the statvfs, so the
    # syscall is never attempted; every real filesystem is still collected (an excludes-only list
    # includes everything else).
    filesystem:
      filesystems:
        excludes: ["tracefs", "debugfs"]

  # Vector's own health (basecradle-noc#215) — the transport that ships this box's log stream is the
  # one component nothing watches. Its own logs are DROPPED from the stream (they echo the sink
  # token — basecradle#338), so Better Stack cannot see it; `introspect-vector` reads only
  # "installed and running", which a running-but-broken Vector satisfies perfectly.
  #
  # These counters are the ONLY thing that sees a SILENT drop: a VRL aborting 100% of events logs
  # NOTHING, yet these read received=N, sent=0, discarded=N.
  ai_internal_metrics:
    type: "internal_metrics"
    scrape_interval_secs: 30

  # Claude Code's OpenTelemetry export (basecradle-router#380). The two Claude Code builders on this
  # box send one log event per model call over OTLP http/protobuf, to the endpoint the NOC's
  # managed-settings file names (basecradle-noc#1179). Only the `logs` output is consumed: the NOC
  # turns metrics export off, and anything arriving on `metrics` or `traces` is discarded here.
  #
  # BOUND TO 127.0.0.1 — the senders are local processes, and nothing off-box may write lines into
  # this box's log store. The gRPC listener is required by the source's schema and has no sender.
  # It is NOT an authenticated channel: any local account can reach the port and name any agent
  # in `basecradle.agent`, and OTLP over TCP carries no sender credential, so a line from here has
  # no kernel-attested sender the way a journald record has `_UID`. What this path ships is what
  # the box's local accounts choose to send, attributed as the sender claims.
  ai_otel:
    type: "opentelemetry"
    grpc:
      address: "127.0.0.1:4317"
    http:
      address: "127.0.0.1:4318"

transforms:
  ai_scrub:
    type: "remap"
    inputs:
      - "ai_journald"
      # The Claude Code builders' rendered `llm` line, so that it gets the same redaction and the
      # same `[identifier]` prefix as every journald line, from the one place that applies them.
      - "ai_otel_llm"
    drop_on_abort: true
    reroute_dropped: false
    source: |
      # Drop whole events that are known secret carriers. sudo logs the full command line (argv)
      # via PAM, so any secret ever passed on a command line is here; Vector's own logs can echo
      # the sink token (component ids / config). Never ship either back to Better Stack.
      if .SYSLOG_IDENTIFIER == "sudo" || ."_COMM" == "sudo" || .SYSLOG_IDENTIFIER == "vector" || ."_SYSTEMD_UNIT" == "vector.service" {
          abort
      }
      # Drop the emitting process's full command line, from EVERY event (basecradle-noc#443).
      # journald attaches argv as the `_CMDLINE` METADATA FIELD, and Vector ships the whole journal
      # record, not just MESSAGE — so every `msg` redaction below is blind to it. The rule above
      # drops `sudo` because PAM logs argv, but that is an identifier allow-list, and `runuser` is
      # not `sudo`: the NOC's fleet-deploy-runner passing `env -i KEY=VALUE …` on argv put all seven
      # harness agents' credentials into the log store through exactly that gap.
      #
      # Unconditional on purpose. Guarding the FIELD holds for every program on this box, including
      # ones this repo has never heard of; guarding a list of identifiers holds only until the next
      # program puts a secret on its own command line, and nothing would announce that. Nothing
      # observable is lost: `_COMM`/`_EXE` still name the binary, and the `[identifier]` prefix added
      # below names the emitting program on every line.
      del(."_CMDLINE")
      # Redact secret-shaped patterns from the message (defense in depth for anything else that
      # logs a secret to stdout — e.g. a heartbeat ping logging its own secret URL on failure).
      #
      # TWO PASSES, IN THIS ORDER, AND ONE WORD RULE (basecradle-router#398). Both are the harness's:
      # the one definition is basecradle-harness docs/telemetry.md → Credential Scrubbing
      # (`_observability.scrub` and `_is_word`, harness 0.185.0). This copy follows it and never
      # varies it. What differs here is only the box's rule set (a subset of the harness's shapes:
      # the harness is the superset by design), its minimums and its labels.
      #   1. The rules anchored on a literal of their own: a heartbeat URL, an `api_key=` assignment
      #      or query value, a bearer header. Each is redacted wherever it matches.
      #   2. The rules anchored on a vendor prefix: `github_pat_`, `gh?_`, `bc_uat_`, `bc_isk_`,
      #      `sk-`, `xai-`, `AIza`, `hf_`, `r8_`, `ste-`, `abl_`, `pplx-`, `tk_`. A match the word rule
      #      reads as a word is kept.
      # Literal rules first, because a prefix rule's run is made of the characters their literals
      # are. When the `sk-` rule ran first, `task-runner-pipeline-api-key=abc123secret` lost
      # `api-key` into the run `sk-runner-pipeline-api-key`, the secret after `=` matched nothing,
      # and it shipped. A prefix run cannot reach across the `[REDACTED]` the first pass leaves.
      msg = to_string(.message) ?? ""
      # Pass 1, in its own order, because these rules run one after another where the harness's are
      # one alternation, so an earlier rule can take a later one's literal.
      #   * The heartbeat URL first, anchored on the literal `/heartbeat/` as the harness's is, so a
      #     URL logged without its scheme is redacted too: anchored on `https?://`,
      #     `curl uptime.betterstack.com/api/v1/heartbeat/SECRET` matched nothing and shipped its
      #     secret. Where the URL has a scheme the rule still takes it from the scheme on, so
      #     userinfo before the host (`https://john:…@host/…/heartbeat/…`) never ships; without one,
      #     the host before `/heartbeat/` stays, as it does in the harness, since it is not the
      #     secret. First, because the bearer rule's token class takes a scheme's `https`, which
      #     would leave the rest of the URL, userinfo included, to the scheme-less arm alone.
      #     The match runs to the end of the space-free run, and a bearer scheme word ending that
      #     run is put back for the bearer rule (basecradle-router#402, the harness's
      #     `_TRAILING_BEARER`): taken with the URL, the word left its token in the next run, which
      #     no rule matched, so compact JSON (`…/heartbeat/K9","auth":"Bearer eyJ…`) and a query
      #     value (`…&access_token=Bearer eyJ…`) shipped the token. Only a word not glued to a
      #     letter or digit is put back, so a secret whose last letters merely spell it
      #     (`…/heartbeat/K9xbearer`) is redacted whole. The word is put back as captured, so what
      #     ships is only ever the word the pattern matched.
      #   * The assignment rule before the bearer rule. The bearer rule's token class takes an
      #     assignment's name and its `=`, so with bearer first, `Bearer api_key=SECRET` lost
      #     `api_key=` into a bearer value and the secret shipped. The assignment rule takes every
      #     bearer scheme in its value, as the harness's does, so `AUTH_API_KEY=Bearer eyJ…` is
      #     redacted whole rather than stopping at the space after `Bearer`.
      #   * The bearer rule takes EVERY scheme word before the token, as the harness's does: a token
      #     stored with its scheme and sent with another reads `Bearer Bearer eyJ…`, and one scheme
      #     word taken alone is the value, leaving the token.
      msg = replace_with(msg, r'(?:https?://\S*)?/heartbeat/\S+') -> |url| {
          kept = parse_regex(url.string, r'(?i)(?:^|[^A-Za-z0-9])(?P<word>bearer)\z') ?? {}
          "[REDACTED_HEARTBEAT_URL]" + (string(kept.word) ?? "")
      }
      # Any `apiKey=` value, whatever it looks like. A Steel (steel.dev) launcher, the browser backend
      # behind Playwright MCP (basecradle/basecradle#582, basecradle-noc#797), puts its key in the
      # `apiKey=` query parameter of its wss://connect.steel.dev URL, and this catches that shape
      # whatever the key's format, so a future format is still covered inside a URL. Case-insensitive
      # and unanchored, it also catches an env dump's `NAME_API_KEY=value` and prints
      # `NAME_apiKey=[REDACTED]`: the name is normalised, the value never ships. The launcher already
      # redacts the exact key from what it forwards to the harness; this is the journald layer.
      #
      # Every replacement is built from fixed strings on purpose, and the two closures put back only
      # what they captured: a capture-group back-reference needs a dollar sign, which Vector
      # interpolates (see the header), and no pattern carries a single quote, which would close the
      # raw string.
      msg = replace(msg, r'(?i)api[-_]?key=(?:bearer\s+)*[^&\s"]+', "apiKey=[REDACTED]")
      msg = replace(msg, r'(?i)bearer\s+(?:bearer\s+)*[A-Za-z0-9._~+/\-]+=*', "Bearer [REDACTED]")
      # Pass 2, the prefix rules, as ONE alternation, as the harness's is: a match kept as a word is
      # never read again by another rule, where a pass per rule would let `hf_…` inside a kept word be
      # cut by the next one. The order of the alternatives is the harness's, and it decides only
      # between the two `bc_` rules, the one place two can match at one position: the wide run is
      # tried first, as in `_PREFIXED`. The rules:
      #   * `github_pat_`, `gh?_`: GitHub tokens, fine-grained personal access tokens and the rest.
      #   * `bc_???_`, `bc_uat_`, `bc_isk_`: BaseCradle credentials, in the harness's two rules. First
      #     any `bc_` + three lowercase letters + `_` with a run of eight or more that takes `_` and `-`, so a
      #     second key glued onto the first (`bc_uat_ABCbc_isk_DEF123`) is taken whole rather than
      #     cut where a narrower run ends; then `bc_uat_` and `bc_isk_` with a run of any length, for
      #     what is shorter. A user access token (`uat`) and an integration signing key (`isk`) each
      #     keep their own label. THIS box is where the signing keys live: the router verifies each
      #     platform delivery's HMAC with the recipient agent's own key, so every one of them sits in
      #     /etc/basecradle-router/router.env and is read into the daemon's environment
      #     (basecradle/basecradle#497).
      #   * `sk-`, `xai-`, `AIza`, `hf_`, `r8_`: provider API keys. Harness agents and builder agents
      #     run with these in their env (ANTHROPIC_API_KEY, OPENROUTER_API_KEY, …), and a wake's
      #     stdout+stderr (a traceback, a curl echo, a misconfigured debug print) flows into journald
      #     under basecradle-wake-<slug> (#168), so it flows through here. Nothing is known to print
      #     one; this is the belt for the braces. `sk-` covers the whole family that shares the
      #     prefix (sk-ant-, sk-proj-, sk-or-v1-, …) in one rule.
      #   * `ste-`: Steel keys, wherever they land, the `steel-api-key` header included.
      #   * `abl_`, `pplx-`, `tk_`: refuseless and Perplexity API keys and ntfy access tokens, the
      #     harness's three newest shapes (harness 0.185.0, basecradle-router#421), all of them
      #     keys a harness agent holds. As of harness 0.185.0, on a box this pass is the only layer
      #     that redacts one inside a prose line (basecradle-harness#857). The `tk_` run also takes
      #     `_` and `-`, which ntfy's own validator admits in a token's 29 characters, so it also
      #     takes a `-word` glued after a token, and a `tk_` identifier not glued to a letter or digit
      #     (`self.tk_root_window_initialized`) is redacted, as the harness's is.
      #
      # THE WORD RULE (basecradle-harness#794). A vendor prefix inside a word is a word, not a
      # credential: `risk-assessment-pending-review` holds `sk-` and is no key. A match is kept only
      # when BOTH hold: a letter, digit or combining mark, in any script, comes right before it, AND
      # its run after the prefix holds no digit and no uppercase letter. Never one without the
      # other, and never a left boundary: a serialization glues a key to a letter or digit
      # (`Bearer%20sk-…`, `ESC[33msk-…`, `密钥sk-…`), and a random key of a vendor's length holds a
      # digit or a capital with overwhelming certainty. The stated residuals, as the harness's: a
      # glued word whose run holds a digit or a capital is redacted (the scrub errs toward
      # redaction), and a glued key made only of lowercase letters, `_` and `-` is kept. One more
      # residual is the harness's open defect, basecradle-harness#858, carried here unchanged until
      # the harness ships its fix: an alphanumeric run glued straight onto a second key takes the
      # letters of that key's prefix and stops at its `_` or `-`, so the rest of the second key
      # matches no rule and ships (`hf_Ab3…Mntk_q8m…` ships `_q8m…`).
      #
      # VRL's regex has no lookbehind and the closure is not given the match's offset, so the
      # pattern captures the one character before the key as `before` (empty at the start of the
      # text) and every branch puts it back. Consuming it takes nothing from an earlier match: every
      # prefix begins with a letter and every run takes letters, so the character before a key is
      # never the last of the match before it. A run is captured apart from its prefix, so a
      # prefix's own capital or digit (`AIza`, `r8_`) is never read as evidence about the run. A run
      # that came back empty is never kept. Every rule's run is at least one character, so this
      # holds only for a rule added to the pattern without its run in `run` below: that rule is
      # redacted, never kept as a word.
      msg = replace_with(msg, r'(?x)
          (?P<before>^|[\s\S])
          (?:
              github_pat_(?P<pat>[A-Za-z0-9_]{20,})
            | gh[a-z]_(?P<gh>[A-Za-z0-9]{20,})
            | bc_(?P<bc_kind>[a-z]{3})_(?P<bc>[A-Za-z0-9_-]{8,})
            | bc_uat_(?P<bc_uat>[A-Za-z0-9]+)
            | bc_isk_(?P<bc_isk>[A-Za-z0-9]+)
            | sk-(?P<sk>[A-Za-z0-9_-]{16,})
            | xai-(?P<xai>[A-Za-z0-9]{16,})
            | AIza(?P<aiza>[A-Za-z0-9_-]{20,})
            | hf_(?P<hf>[A-Za-z0-9]{20,})
            | r8_(?P<r8>[A-Za-z0-9]{20,})
            | ste-(?P<ste>[A-Za-z0-9]{20,})
            | abl_(?P<abl>[A-Za-z0-9]{20,})
            | pplx-(?P<pplx>[A-Za-z0-9]{20,})
            | tk_(?P<tk>[A-Za-z0-9_-]{20,})
          )') -> |key| {
          before = string(key.before) ?? ""
          run = string(key.pat) ?? string(key.gh) ?? string(key.bc) ?? string(key.bc_uat) ?? string(key.bc_isk) ?? string(key.sk) ?? string(key.xai) ?? string(key.aiza) ?? string(key.hf) ?? string(key.r8) ?? string(key.ste) ?? string(key.abl) ?? string(key.pplx) ?? string(key.tk) ?? ""
          if run != "" && match(before, r'^[\p{L}\p{N}\p{M}]') && !match(run, r'[0-9A-Z]') {
              key.string
          } else if key.pat != null || key.gh != null {
              before + "[REDACTED_GH_TOKEN]"
          } else if key.bc_isk != null || key.bc_kind == "isk" {
              before + "[REDACTED_BC_INTEGRATION_SECRET]"
          } else if key.bc_uat != null || key.bc != null {
              before + "[REDACTED_BC_TOKEN]"
          } else {
              before + "[REDACTED_API_KEY]"
          }
      }
      # PRESENTATION — prefix the message with the emitting program's journald identifier, so a
      # Live Tail line is self-describing: `[basecradle-router] stage=wake outcome=ok agent=… `.
      # Fall back to the process comm, then to "unknown", so a line with no identifier (a kernel
      # message) still gets a prefix rather than a bare `[] `. Prefixing AFTER redaction is
      # deliberate: the prefix is not secret-bearing and must never itself be scanned or mangled.
      ident = to_string(.SYSLOG_IDENTIFIER) ?? ""
      if ident == "" { ident = to_string(."_COMM") ?? "" }
      if ident == "" { ident = "unknown" }
      .message = "[" + ident + "] " + msg
      # Better Stack reads the event timestamp from `dt` (mirrors the generated log parser).
      del(.source_type)
      .dt = del(.timestamp)

  # A Claude Code model call, rendered as the fleet's `llm` line (basecradle-router#380). The grammar
  # is the harness's telemetry contract (basecradle-harness docs/telemetry.md, Model Calls), and
  # this transform writes the contract's line and NOTHING else: contract heads, contract fields,
  # contract meanings, in the harness's field order, so every Better Stack column and chart that
  # reads a harness agent's `llm` line reads a builder's with no change.
  #
  # NOTHING FROM THE INPUT EVENT SHIPS AS-IS. The event is rebuilt from scratch, out of values
  # checked here: the slug and the model id against a fixed charset, the request id against
  # another, every count as a non-negative integer, the cost as a finite non-negative number, and
  # one free-text value, a failed call's error text, rendered as `detail` (below). A Claude Code
  # event also carries the session, user and account identifiers, the prompt id and the terminal
  # type; none of them is a contract field, so none of them reaches the sink. The rebuilt line then
  # passes through `ai_scrub` like every journald line: a charset admits a key-shaped value, so the
  # redaction still applies, and `ai_scrub` adds the `[basecradle-wake-<slug>]` prefix from the
  # identifier set here.
  #
  # `detail` is the one value no charset limits, so it is what a sender on the unauthenticated port
  # (see `ai_otel`) can say most freely: up to 240 characters of its own text on a line under any
  # builder's identifier. It is quoted, so no consumer that reads only unquoted tokens can be forged
  # from it, but a consumer that matches anywhere in the message reads it like any other text.
  #
  # `drop_on_error` as well as `drop_on_abort`: on a runtime error a remap otherwise forwards the
  # ORIGINAL event, every identifier above included. A failure here drops the event, never ships it.
  #
  # TWO EVENTS ARE RENDERED, ONE LINE EACH, and every other Claude Code event (a prompt, a tool
  # result, a plugin load, `api_retries_exhausted`) is dropped whole. The contract writes one `llm`
  # line per model-call attempt with a required `outcome` (basecradle-harness#782, ruled
  # 2026-11-03), and a builder writes the two it has:
  #   * `claude_code.api_request`, a call that answered: a billed line, `outcome=ok`;
  #   * `claude_code.api_error`, a call that ended with no answer: a decision line,
  #     `outcome=failed reason=<slug>`, with no token or cost field (basecradle-router#384).
  #
  # `api_error` IS `failed`, NEVER `retrying`. Claude Code sends it once per call, after its own
  # retries are spent (measured on Claude Code 2.1.317 against a loopback 503: three requests on the
  # wire, one `api_error` with `attempt` 3, then an `api_retries_exhausted` naming the same failure,
  # which is dropped so a failure is counted once). Its fields are `model`, `error`, `status_code`,
  # `duration_ms`, `attempt`, `request_id` and `query_source`; a connection failure has no
  # `status_code` and no `request_id`. Two of them are not written as they arrive:
  #   * `duration_ms` is the LAST attempt's time (4ms in that run, beside a 1640ms total), and the
  #     contract's `duration` is the caller's whole wait. So it is written only for a call that
  #     made one attempt and reached Anthropic (a status came back), where the two are the same;
  #     a retried call's whole wait is not on this event, and a connection failure never reached
  #     the vendor, which is when the contract leaves `duration` out;
  #   * `attempt` is a count with no total, and the contract spells it `n/total`, so it is left off;
  #   * the error text rides as `detail`, never `error`, because `detail` is the field that explains
  #     `reason` on an `llm` line.
  # The slug is the contract's own, row for row from its one Fault Slugs table (basecradle-harness
  # `docs/telemetry.md`, read at 9c574c4, basecradle-harness#786), so a builder's failure and a
  # harness agent's count in one series; the table is the reference, never this comment. It is read
  # off `status_code`, and the key's ABSENCE is the no-HTTP-answer row. Two kinds of call send none
  # (measured on Claude Code 2.1.317 against loopback): a connection that failed (`Connection
  # error.`), which is `transport`, and one that ran out of Claude Code's own deadline (`Request
  # timed out.`), which the contract names `timeout`, never `transport`. That is the one place the
  # error text is read, and only as an exact match on the SDK's own message, which no vendor wrote
  # because none answered; a message that changes falls back to `transport`. A status that came
  # back unreadable is still an answer: `api_error`, the any-other-status row.
  #
  # A FAILED LINE IS WARNING, NEVER ERROR. The NOC's Error on AI Server alert pages on any ERROR
  # line under a `basecradle-wake-` identifier, so ERROR would make a builder's failed call a page,
  # and whether builder failures page is an open policy question (basecradle/basecradle#726), not a
  # rendering one. WARNING puts the line on the NOC's failures column and in the log stream, which
  # is what the contract asks of it. A call that answered stays INFO.
  #
  # `detail` is rendered as the harness renders a value (`_observability._value` there): control
  # characters and runs of whitespace become one space, so a record stays one line; a value holding
  # a space, an `=` or a double quote is double-quoted, its own double quotes turned into single
  # quotes, so the NOC's outcome predicate (which reads only tokens outside quoted values) cannot be
  # forged from inside it; and it is bounded at 240 characters. The bound differs from the harness's
  # in one respect. The redaction in `ai_scrub` runs after this transform, and every redaction rule
  # with a minimum length (`ghp_…`, `sk-…`, `AIza…` and the rest) matches a run of letters, digits,
  # `_` and `-`, so a credential cut short of its minimum would ship unredacted. The cut therefore
  # never falls inside such a run: it backs up to the last character outside one (a space, a
  # quote, a brace, a dot). A value that is one such run past the bound is omitted, never shipped
  # half-scrubbed. A new redaction rule with a minimum length over a wider charset widens this cut.
  #
  # The numbers mirror the harness's own formatting (`_observability` and `_anthropic` there):
  #   * tokens_in is the whole prompt, input + cache read + cache write, because Claude Code's
  #     `input_tokens` excludes both cache parts; tokens_total is exactly tokens_in + tokens_out;
  #   * cached_tokens is written whenever the cache read is reported, zero included, and
  #     cache_write_tokens only when it is non-zero, as the Anthropic adapter writes them;
  #   * a usage block of nothing but zeros is not usage: no token field is written, and no cost
  #     unless a non-zero one was stated;
  #   * duration is seconds to two decimals, and cost is fixed-point dollars to at most eight
  #     decimals with trailing zeros trimmed. Both are built with integer arithmetic, because VRL's
  #     format_number truncates instead of rounding (1.508 renders 1.50).
  # `cost_basis=computed` because Claude Code's figure is arithmetic over a published rate, which is
  # what that value means (the capital's call).
  #
  # AN AUXILIARY CALL IS `purpose=helper`, WITH NO `kind` (basecradle-harness#782). It is a second
  # model working for the builder, which is what `helper` means, and the contract leaves `kind` out
  # for a producer that names no job. Every other `query_source` (`main`, `sdk`, a subagent) is the
  # builder's own turn: `purpose=main`. The purpose is read the same way on both events, so a failed
  # auxiliary call is a failed helper call.
  #
  # Every regex below ends on the end-of-text anchor `\z`, never the usual end-of-line one: that one
  # is the dollar sign, which Vector would interpolate (see the header).
  ai_otel_llm:
    type: "remap"
    inputs:
      - "ai_otel.logs"
    drop_on_abort: true
    drop_on_error: true
    reroute_dropped: false
    source: |
      event = .message
      if event != "claude_code.api_request" && event != "claude_code.api_error" { abort }
      failed = event == "claude_code.api_error"
      attrs = object(.attributes) ?? {}
      resources = object(.resources) ?? {}
      # The agent is named by the NOC's per-builder resource attribute and nothing else, and it
      # becomes part of a journald identifier: a slug, or no line at all.
      slug = string(resources."basecradle.agent") ?? ""
      if !match(slug, r'^[a-z0-9-]{1,64}\z') { abort }
      # The contract never omits `model`, and the value is written bare: a model id, or no line.
      model = string(attrs.model) ?? ""
      if !match(model, r'^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,127}\z') { abort }
      purpose = "main"
      if attrs.query_source == "auxiliary" { purpose = "helper" }
      # Claude Code may send a number as a string; either way it is a non-negative integer below
      # 10^18 or it was not stated. The bound keeps every sum below the integer ceiling, where VRL
      # arithmetic would wrap negative.
      n = map_values({
        "uncached": attrs.input_tokens,
        "output": attrs.output_tokens,
        "read": attrs.cache_read_tokens,
        "written": attrs.cache_creation_tokens,
        "ms": attrs.duration_ms,
        "attempt": attrs.attempt,
        "status": attrs.status_code,
      }) -> |value| {
        if is_integer(value) && int!(value) >= 0 && int!(value) < 1000000000000000000 {
          value
        } else if is_string(value) && match(string!(value), r'^[0-9]{1,18}\z') {
          to_int!(value)
        } else {
          null
        }
      }
      line = "llm provider=anthropic purpose=" + purpose + " model=" + model
      # A status, readable or not, means Anthropic answered; none at all means it never did.
      answered = attrs.status_code != null
      # A failed call's time is its last attempt's, so it is the call's whole wait only when the
      # call made one attempt and that attempt reached Anthropic (a status came back; see above).
      if n.ms != null && (!failed || (n.attempt == 1 && answered)) {
        centis = to_int(round(int!(n.ms) / 10))
        line = line + " duration=" + to_string(to_int((centis - mod(centis, 100)) / 100))
        line = line + "." + slice!(to_string(mod(centis, 100) + 100), 1) + "s"
      }
      if failed {
        # A decision line: no tokens and no cost.
        # The contract's Fault Slugs table, row for row (see above).
        reason = "api_error"
        if !answered {
          reason = "transport"
          if attrs.error == "Request timed out." { reason = "timeout" }
        } else if n.status != null {
          code = int!(n.status)
          if code == 401 || code == 403 {
            reason = "config:auth"
          } else if code == 402 {
            reason = "config:billing"
          } else if code == 404 {
            reason = "config:model_not_found"
          } else if code == 413 {
            reason = "payload_too_large"
          } else if code == 429 {
            reason = "rate_limited"
          } else if code == 504 {
            reason = "timeout"
          } else if code >= 500 && code <= 599 {
            reason = "server_error"
          }
        }
        line = line + " outcome=failed reason=" + reason
        # Flatten: a control character (newline, tab, escape) or a run of whitespace is one space.
        detail = string(attrs.error) ?? ""
        detail = strip_whitespace(replace(replace(detail, r'\p{Cc}', " "), r'\s+', " "))
        if strlen(detail) > 240 {
          # Bound: 239 characters and an ellipsis, never cut inside a credential-charset run (see
          # above).
          cut = parse_regex(detail, r'\A(?P<head>.{239})(?P<next>.)') ?? {}
          head = string(cut.head) ?? ""
          if match(string(cut.next) ?? "", r'\A[A-Za-z0-9_-]\z') {
            head = replace(head, r'[A-Za-z0-9_-]*\z', "")
          }
          head = strip_whitespace(head)
          detail = ""
          if head != "" { detail = head + "…" }
        }
        if detail != "" {
          if contains(detail, " ") || contains(detail, "=") || contains(detail, "\"") {
            detail = "\"" + replace(detail, "\"", "'") + "\""
          }
          line = line + " detail=" + detail
        }
      } else {
        # A billed line.
        usage_stated = n.uncached != null || n.output != null
        usage_reported = false
        if usage_stated {
          written = 0
          if n.written != null { written = int!(n.written) }
          read = 0
          if n.read != null { read = int!(n.read) }
          tokens_in = written + read
          if n.uncached != null { tokens_in = tokens_in + int!(n.uncached) }
          tokens_out = 0
          if n.output != null { tokens_out = int!(n.output) }
          usage_reported = tokens_in != 0 || tokens_out != 0
          if usage_reported {
            line = line + " tokens_in=" + to_string(tokens_in) + " tokens_out=" + to_string(tokens_out)
            line = line + " tokens_total=" + to_string(tokens_in + tokens_out)
            if n.read != null { line = line + " cached_tokens=" + to_string(read) }
            if written != 0 { line = line + " cache_write_tokens=" + to_string(written) }
          }
        }
        cost = attrs.cost_usd
        if is_string(cost) && match(string!(cost), r'^[0-9]{1,9}(\.[0-9]{1,20})?\z') {
          cost = to_float!(cost)
        }
        # The upper bound is the guard against a non-finite figure: NaN and infinity both fail it.
        if (is_float(cost) || is_integer(cost)) && to_float!(cost) >= 0 && to_float!(cost) < 1000000000 {
          # In hundred-millionths of a dollar: the harness renders cost to eight decimals.
          units = to_int(round(to_float!(cost) * 100000000))
          if units != 0 || !usage_stated || usage_reported {
            fraction = slice!(to_string(mod(units, 100000000) + 100000000), 1)
            fraction = replace(fraction, r'0+\z', "")
            money = to_string(to_int((units - mod(units, 100000000)) / 100000000))
            if fraction != "" { money = money + "." + fraction }
            line = line + " cost=" + money + " cost_basis=computed"
          }
        }
        line = line + " outcome=ok"
      }
      request_id = string(attrs.request_id) ?? ""
      if match(request_id, r'^[A-Za-z0-9_-]{1,128}\z') {
        line = line + " generation_id=" + request_id
      }
      level = "INFO"
      if failed { level = "WARNING" }
      at = .timestamp
      if at == null { at = .observed_timestamp }
      if at == null { at = now() }
      # The shape of a journald record, as `ai_scrub` reads one: it prefixes the message with
      # SYSLOG_IDENTIFIER and moves `timestamp` to Better Stack's `dt`.
      . = {
        "message": level + " " + line,
        "SYSLOG_IDENTIFIER": "basecradle-wake-" + slug,
        "host": get_hostname!(),
        "timestamp": at,
      }

sinks:
  better_stack_logs:
    type: "http"
    method: "post"
    uri: "https://s2780873.eu-central-1a.betterstackdata.com/"
    encoding:
      codec: "json"
    compression: "gzip"
    auth:
      strategy: "bearer"
      token: "${BETTERSTACK_AI_SOURCE_TOKEN}"
    inputs: ["ai_scrub"]

  better_stack_metrics:
    type: "http"
    method: "post"
    uri: "https://s2780873.eu-central-1a.betterstackdata.com/metrics"
    encoding:
      codec: "json"
    compression: "gzip"
    auth:
      strategy: "bearer"
      token: "${BETTERSTACK_AI_SOURCE_TOKEN}"
    inputs: ["ai_host_metrics"]

  # Vector's health counters, exposed for the NOC to READ OFF THE BOX (basecradle-noc#215).
  #
  # DELIBERATELY NOT SHIPPED TO BETTER STACK. A Vector whose SINK is broken cannot ship the metric
  # that says its sink is broken — a self-report through the failing channel is not a monitor. So the
  # counters are exposed here and PULLED out-of-band by the NOC's `introspect-vector-health` op, over
  # a channel (ssh -> fleet-deploy-runner -> localhost) independent of the pipe under test.
  #
  # BOUND TO 127.0.0.1 — this is not a network service. Nothing off-box can reach it; the only reader
  # is a root-owned wrapper op on this same machine, which returns counts and never log text.
  ai_vector_health_exporter:
    type: "prometheus_exporter"
    inputs: ["ai_internal_metrics"]
    address: "127.0.0.1:9598"

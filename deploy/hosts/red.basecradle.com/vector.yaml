                  } else if !includes(["", "'<a redacted value>'", "'<a value the box redacted>'"], value) {
                      . = set!(., [field], "'<a value the box redacted>'")
                  }
              }
          }
      }
      # Redact secret-shaped patterns from the message (defense in depth for anything else that
      # logs a secret to stdout — e.g. a heartbeat ping logging its own secret URL on failure).
      #
      # TWO PASSES, IN THIS ORDER, AND ONE WORD RULE (basecradle-router#398). Both are the harness's:
      # the one definition is basecradle-harness docs/telemetry.md → Credential Scrubbing
      # (`_observability.scrub` and `_is_word`, harness 0.186.0). This copy follows it and never
      # varies it. What differs here is only the box's rule set (a subset of the harness's shapes:
      # the harness is the superset by design), its minimums and its labels.
      #   1. The rules anchored on a literal of their own: a heartbeat URL, an `x-api-key` header
      #      value, an `api_key=` assignment or query value, a bearer header. Each is redacted
      #      wherever it matches.
      #   2. The rules anchored on a vendor prefix: `github_pat_`, `gh?_`, `bc_uat_`, `bc_isk_`,
      #      `sk-`, `xai-`, `AIza`, `hf_`, `r8_`, `ste-`, `abl_`, `pplx-`, `tk_`. A match the word rule
      #      reads as a word is kept.
      # Literal rules first, because a prefix rule's run is made of the characters their literals
      # are. When the `sk-` rule ran first, `task-runner-pipeline-api-key=abc123secret` lost
      # `api-key` into the run `sk-runner-pipeline-api-key`, the secret after `=` matched nothing,
      # and it shipped. A prefix run cannot reach across the `[REDACTED]` the first pass leaves.
      msg = to_string(.message) ?? ""
      # Pass 1, in its own order, because these rules run one after another where the harness's are
      # one alternation, so an earlier rule can take a later one's literal.
      #   * The heartbeat URL first, anchored on the literal `/heartbeat/` as the harness's is, so a
      #     URL logged without its scheme is redacted too: anchored on `https?://`,
      #     `curl uptime.betterstack.com/api/v1/heartbeat/SECRET` matched nothing and shipped its
      #     secret. Where the URL has a scheme the rule still takes it from the scheme on, so
      #     userinfo before the host (`https://john:…@host/…/heartbeat/…`) never ships; without one,
      #     the host before `/heartbeat/` stays, as it does in the harness, since it is not the
      #     secret. First, because the bearer rule's token class takes a scheme's `https`, which
      #     would leave the rest of the URL, userinfo included, to the scheme-less arm alone.
      #     The match runs to the end of the space-free run, and a bearer scheme word ending that
      #     run is put back for the bearer rule (basecradle-router#402, the harness's
      #     `_TRAILING_BEARER`): taken with the URL, the word left its token in the next run, which
      #     no rule matched, so compact JSON (`…/heartbeat/K9","auth":"Bearer eyJ…`) and a query
      #     value (`…&access_token=Bearer eyJ…`) shipped the token. Only a word not glued to a
      #     letter or digit is put back, so a secret whose last letters merely spell it
      #     (`…/heartbeat/K9xbearer`) is redacted whole. The word is put back as captured, so what
      #     ships is only ever the word the pattern matched.
      #     A kv value's closing quote ending the run is put back too (basecradle-router#423, the
      #     harness's `_CLOSING_QUOTE`, harness 0.186.0): taken with the URL, it left
      #     `url="[REDACTED_HEARTBEAT_URL] next=1`, a line with an unclosed value that no kv parser
      #     reads. A closing quote is a `"` followed by the next `key=` (coloured or not), by the line's
      #     end, or by the colour reset closing a coloured pair, so the pattern captures what follows
      #     the run as `after` and the closure puts back the quote, the reset and `after` exactly as
      #     matched; `after` is spaces, a colour code and a field name, never part of the secret, and
      #     every later rule still reads it. The URL itself is always redacted, even when nothing
      #     follows `/heartbeat/` but the quote: the harness keeps a quoted value ending in
      #     `/heartbeat/`, since it holds no secret, but this rule's match from the scheme on is what
      #     keeps userinfo before the host from ever shipping, and that holds only if the match is
      #     never handed back. So the guard only ever restores a quote, and nothing redacted before is
      #     redacted less.
      #   * The `x-api-key` header rule before the assignment rule (basecradle-router#423, the
      #     harness's first literal rule, basecradle-harness#861). A credential sent as an `x-api-key`
      #     header value is redacted by its name, never its shape, because the vendor that sends it
      #     there (Wiro) states no shape for its key. The name is any case, with `_` for either
      #     hyphen, followed by `:` or `=>` (a header dump, a Ruby hash), or by a quote, escaped or
      #     not, and then `:`, `=`, `=>` or `,` (`"x-api-key": "…"`, JSON inside a JSON string, a
      #     `('x-api-key', '…')` header tuple). The value may open with a quote, an escaped quote, a
      #     bytes literal's `b'`, or bearer scheme words, and runs to the next space, quote, backslash
      #     or `&`; a bearer header glued to it (`x-api-key: KBearer eyJ…`) is taken with its token.
      #     The unquoted `X-API-Key=…` is left to the assignment rule, which takes it with the wider
      #     value it allows. It runs before that rule so the header's name goes with its value, and
      #     its label carries a `:`, never a `=`, so the assignment rule never reads it again. A
      #     single quote is written `\x27`, because a raw string cannot hold one.
      #   * The assignment rule before the bearer rule. The bearer rule's token class takes an
      #     assignment's name and its `=`, so with bearer first, `Bearer api_key=SECRET` lost
      #     `api_key=` into a bearer value and the secret shipped. The assignment rule takes every
      #     bearer scheme in its value, as the harness's does, so `AUTH_API_KEY=Bearer eyJ…` is
      #     redacted whole rather than stopping at the space after `Bearer`. Its value may open with
      #     a `"`, and a bearer header glued to the value goes with it, as the harness's does
      #     (basecradle-router#423, basecradle-harness#866): `API_KEY="…"` matched nothing, because
      #     the value could not start at the quote, and `api_key=KBearer eyJ…` ended the value at the
      #     scheme word and left its token to no rule. The value is two alternatives, the first a
      #     value ending in a glued `bearer` and its token. On the box this one rule is also the
      #     query-value rule (`?apiKey=…`); the harness's wider query rule for `token=` and `key=` is
      #     a shape the box does not carry.
      #   * The bearer rule takes EVERY scheme word before the token, as the harness's does: a token
      #     stored with its scheme and sent with another reads `Bearer Bearer eyJ…`, and one scheme
      #     word taken alone is the value, leaving the token.
      msg = replace_with(msg, r'(?P<url>(?:https?://\S*)?/heartbeat/\S+)(?P<after>[ \t]+(?:\x1b\[[0-9;]*m)?[A-Za-z_][A-Za-z0-9_]*=|[ \t]*(?:\n|\z))?') -> |hb| {
          url = string(hb.url) ?? ""
          closing = parse_regex(url, r'\A(?P<body>[\s\S]*?)(?P<quote>"\x1b\[0m|")\z') ?? {}
          quote = string(closing.quote) ?? ""
          if quote == "\"" && hb.after == null { quote = "" }
          if quote != "" { url = string(closing.body) ?? url }
          kept = parse_regex(url, r'(?i)(?:^|[^A-Za-z0-9])(?P<word>bearer)\z') ?? {}
          "[REDACTED_HEARTBEAT_URL]" + (string(kept.word) ?? "") + quote + (string(hb.after) ?? "")
      }
      # Any `apiKey=` value, whatever it looks like. A Steel (steel.dev) launcher, the browser backend
      # behind Playwright MCP (basecradle/basecradle#582, basecradle-noc#797), puts its key in the
      # `apiKey=` query parameter of its wss://connect.steel.dev URL, and this catches that shape
      # whatever the key's format, so a future format is still covered inside a URL. Case-insensitive
      # and unanchored, it also catches an env dump's `NAME_API_KEY=value` and prints
      # `NAME_apiKey=[REDACTED]`: the name is normalised, the value never ships. The launcher already
      # redacts the exact key from what it forwards to the harness; this is the journald layer.
      #
      # Every replacement is built from fixed strings on purpose, and the two closures put back only
      # what they captured: a capture-group back-reference needs a dollar sign, which Vector
      # interpolates (see the header), and no pattern carries a single quote, which would close the
      # raw string.
      msg = replace(msg, r'(?i:x[-_]api[-_]?key)(?:\\?["\x27]\s*(?:=>|[:=,])|\s*(?::|=>))\s*(?:b?\\?["\x27])?(?:(?i:bearer)\s+)*(?:[^\s"\x27&\\]*?(?i:bearer)\s+[A-Za-z0-9._~+/-]{8,}|[^\s"\x27&\\]+)', "x-api-key: [REDACTED]")
      # A marker after the `=` is kept as it is (basecradle-router#494): it is a value already
      # redacted, by the print site or by the rule at the top of this program, and read as a value
      # the marker's `'<a` became `apiKey=[REDACTED] redacted value>'`, which is how the print site's
      # marker shipped before this kept it. It is tried first, case-sensitive, as its own
      # alternative, so nothing else this rule matches changes, and it is kept only where the
      # canary's run would end after it, as the credential rule keeps one: a marker with anything
      # glued to it is a value, and goes whole.
      msg = replace_with(msg, r'(?i)api[-_]?key=(?:(?P<kept>(?-i:\x27<a redacted value>\x27|\x27<a value the box redacted>\x27)(?:[\x20\t",}\n\r\x00\x0b\x0c\x1c\x1d\x1e\x85\x{2028}\x{2029}]|\z))|(?-i:\x27<a redacted value>\x27|\x27<a value the box redacted>\x27)[^&\x20\t",}\n\r\x00\x0b\x0c\x1c\x1d\x1e\x85\x{2028}\x{2029}]*|"?(?:bearer\s+)*(?:[^&\s"]*?bearer\s+[A-Za-z0-9._~+/\-]{8,}|[^&\s"]+))') -> |assignment| {
          if assignment.kept != null { assignment.string } else { "apiKey=[REDACTED]" }
      }
      msg = replace(msg, r'(?i)bearer\s+(?:bearer\s+)*[A-Za-z0-9._~+/\-]+=*', "Bearer [REDACTED]")
      # Pass 2, the prefix rules, as ONE alternation, as the harness's is: a match kept as a word is
      # never read again by another rule, where a pass per rule would let `hf_…` inside a kept word be
      # cut by the next one. The order of the alternatives is the harness's, and it decides only
      # between the two `bc_` rules, the one place two can match at one position: the wide run is
      # tried first, as in `_PREFIXED`. The rules:
      #   * `github_pat_`, `gh?_`: GitHub tokens, fine-grained personal access tokens and the rest.
      #   * `bc_???_`, `bc_uat_`, `bc_isk_`: BaseCradle credentials, in the harness's two rules. First
      #     any `bc_` + three lowercase letters + `_` with a run of eight or more that takes `_` and `-`, so a
      #     second key glued onto the first (`bc_uat_ABCbc_isk_DEF123`) is taken whole rather than
      #     cut where a narrower run ends; then `bc_uat_` and `bc_isk_` with a run of any length, for
      #     what is shorter. A user access token (`uat`) and an integration signing key (`isk`) each
      #     keep their own label. THIS box is where the signing keys live: the router verifies each
      #     platform delivery's HMAC with the recipient agent's own key, so every one of them sits in
      #     /etc/basecradle-router/router.env and is read into the daemon's environment
      #     (basecradle/basecradle#497).
      #   * `sk-`, `xai-`, `AIza`, `hf_`, `r8_`: provider API keys. Harness agents and builder agents
      #     run with these in their env (ANTHROPIC_API_KEY, OPENROUTER_API_KEY, …), and a wake's
      #     stdout+stderr (a traceback, a curl echo, a misconfigured debug print) flows into journald
      #     under basecradle-wake-<slug> (#168), so it flows through here. Nothing is known to print
      #     one; this is the belt for the braces. `sk-` covers the whole family that shares the
      #     prefix (sk-ant-, sk-proj-, sk-or-v1-, …) in one rule. The `xai-` run takes `_` and `-`,
      #     as the harness's does (basecradle-router#425): an xAI management key, the
      #     `xai_account_balance` tool's credential, is `xai-`, five alphanumerics, a `_` or `-`,
      #     then an 80-character run, and an alphanumeric run matched none of it, so it shipped
      #     whole. Its minimum stays this box's 16, as `sk-`'s does, where the harness's is 8.
      #   * `ste-`: Steel keys, wherever they land, the `steel-api-key` header included.
      #   * `abl_`, `pplx-`, `tk_`: refuseless and Perplexity API keys and ntfy access tokens, the
      #     harness's three newest shapes (harness 0.185.0, basecradle-router#421), all of them
      #     keys a harness agent holds. Before harness 0.186.0 scrubbed every rendered record at
      #     its source (basecradle-harness#857), this pass was the only layer that redacted one
      #     inside a prose line, and it still is for any program that does not. The `tk_` run also takes
      #     `_` and `-`, which ntfy's own validator admits in a token's 29 characters, so it also
      #     takes a `-word` glued after a token, and a `tk_` identifier not glued to a letter or digit
      #     (`self.tk_root_window_initialized`) is redacted, as the harness's is.
      #
      # THE WORD RULE (basecradle-harness#794). A vendor prefix inside a word is a word, not a
      # credential: `risk-assessment-pending-review` holds `sk-` and is no key. A match is kept only
      # when BOTH hold: a letter, digit or combining mark, in any script, comes right before it, AND
      # its run after the prefix holds no digit and no uppercase letter. Never one without the
      # other, and never a left boundary: a serialization glues a key to a letter or digit
      # (`Bearer%20sk-…`, `ESC[33msk-…`, `密钥sk-…`), and a random key of a vendor's length holds a
      # digit or a capital with overwhelming certainty. The stated residuals, as the harness's: a
      # glued word whose run holds a digit or a capital is redacted (the scrub errs toward
      # redaction), and a glued key made only of lowercase letters, `_` and `-` is kept.
      #
      # A NARROW RUN NEVER SWALLOWS THE HEAD OF A KEY GLUED AFTER IT (basecradle-router#423, the
      # harness's `_rule` and `_GLUED_KEY`, basecradle-harness#858). A run whose class lacks `_` or
      # `-` once took the letters of a following key's prefix and stopped at its `_` or `-`, so the
      # rest of the second key matched no rule and shipped (`hf_Ab3…Mntk_q8m…` shipped `_q8m…`),
      # and a first match kept as a word kept the second key with it. The narrow rules are
      # `github_pat_`, `gh?_`, `bc_uat_`, `bc_isk_`, `hf_`, `r8_`, `ste-`, `abl_` and `pplx-`
      # (`xai-` was one until its run took the harness's class, basecradle-router#425). Each is now
      # two alternatives, the first tried first: its run, as short as it can be, then a WHOLE KEY BY ITS
      # OWN RULE at that rule's own minimum (every rule of this pass, at this box's minimums, so
      # `sk-` at 16), then everything after it in the widest class, so a third key glued on goes
      # with the second; otherwise the run as it always was. That is a negative lookahead written
      # without one, because VRL's regex has none. Each rule captures its glued alternative under
      # its own name (`hf_glued`, …), because the regex allows no name twice, and a match whose
      # glued capture is set is NEVER kept as a word: its tail can hold a later key that was no
      # part of any word (`xhf_…ghp_…-sk-…`, whose `sk-` follows a `-`), and read as one
      # all-lowercase run it would be kept. No word holds a whole key by a rule's own shape. The
      # word test refuses it twice over: a glued capture leaves every plain run capture unset, so
      # `run` is empty, and the test also asks `glued == ""` outright, as the harness's
      # `_is_word` does, so a run chain that one day reads a glued capture cannot keep one. A
      # glued match takes the first key's label. The cost is the harness's over-redaction in the
      # rare glued case: a `-word` glued after the second key goes with it. A wide run already
      # takes a glued key whole. The `bc_uat_` and `bc_isk_` glued alternatives never match here: a
      # glued key makes the run eight or more characters of the wide class, and the wide `bc_???_`
      # rule before them takes it first, as it does in the harness. They are kept so this pass
      # stays the harness's, rule for rule. The nine copies of the whole-key alternation are one
      # string, pinned identical by tests/test_log_surface.py.
      #
      # VRL's regex has no lookbehind and the closure is not given the match's offset, so the
      # pattern captures the one character before the key as `before` (empty at the start of the
      # text) and every branch puts it back. Consuming it takes nothing from an earlier match: every
      # prefix begins with a letter and every run takes letters, so the character before a key is
      # never the last of the match before it. A run is captured apart from its prefix, so a
      # prefix's own capital or digit (`AIza`, `r8_`) is never read as evidence about the run. A run
      # that came back empty is never kept. Every rule's run is at least one character, so this
      # holds only for a rule added to the pattern without its run in `run` below: that rule is
      # redacted, never kept as a word.
      msg = replace_with(msg, r'(?x)
          (?P<before>^|[\s\S])
          (?:
              github_pat_(?:(?P<pat_glued>[A-Za-z0-9_]{20,}?
                  (?:github_pat_[A-Za-z0-9_]{20}|gh[a-z]_[A-Za-z0-9]{20}|bc_[a-z]{3}_[A-Za-z0-9_-]{8}|bc_uat_[A-Za-z0-9]{1}|bc_isk_[A-Za-z0-9]{1}|sk-[A-Za-z0-9_-]{16}|xai-[A-Za-z0-9_-]{16}|AIza[A-Za-z0-9_-]{20}|hf_[A-Za-z0-9]{20}|r8_[A-Za-z0-9]{20}|ste-[A-Za-z0-9]{20}|abl_[A-Za-z0-9]{20}|pplx-[A-Za-z0-9]{20}|tk_[A-Za-z0-9_-]{20})
                  [A-Za-z0-9_-]*)|(?P<pat>[A-Za-z0-9_]{20,}))
            | gh[a-z]_(?:(?P<gh_glued>[A-Za-z0-9]{20,}?
                  (?:github_pat_[A-Za-z0-9_]{20}|gh[a-z]_[A-Za-z0-9]{20}|bc_[a-z]{3}_[A-Za-z0-9_-]{8}|bc_uat_[A-Za-z0-9]{1}|bc_isk_[A-Za-z0-9]{1}|sk-[A-Za-z0-9_-]{16}|xai-[A-Za-z0-9_-]{16}|AIza[A-Za-z0-9_-]{20}|hf_[A-Za-z0-9]{20}|r8_[A-Za-z0-9]{20}|ste-[A-Za-z0-9]{20}|abl_[A-Za-z0-9]{20}|pplx-[A-Za-z0-9]{20}|tk_[A-Za-z0-9_-]{20})
                  [A-Za-z0-9_-]*)|(?P<gh>[A-Za-z0-9]{20,}))
            | bc_(?P<bc_kind>[a-z]{3})_(?P<bc>[A-Za-z0-9_-]{8,})
            | bc_uat_(?:(?P<bc_uat_glued>[A-Za-z0-9]+?
                  (?:github_pat_[A-Za-z0-9_]{20}|gh[a-z]_[A-Za-z0-9]{20}|bc_[a-z]{3}_[A-Za-z0-9_-]{8}|bc_uat_[A-Za-z0-9]{1}|bc_isk_[A-Za-z0-9]{1}|sk-[A-Za-z0-9_-]{16}|xai-[A-Za-z0-9_-]{16}|AIza[A-Za-z0-9_-]{20}|hf_[A-Za-z0-9]{20}|r8_[A-Za-z0-9]{20}|ste-[A-Za-z0-9]{20}|abl_[A-Za-z0-9]{20}|pplx-[A-Za-z0-9]{20}|tk_[A-Za-z0-9_-]{20})
                  [A-Za-z0-9_-]*)|(?P<bc_uat>[A-Za-z0-9]+))
            | bc_isk_(?:(?P<bc_isk_glued>[A-Za-z0-9]+?
                  (?:github_pat_[A-Za-z0-9_]{20}|gh[a-z]_[A-Za-z0-9]{20}|bc_[a-z]{3}_[A-Za-z0-9_-]{8}|bc_uat_[A-Za-z0-9]{1}|bc_isk_[A-Za-z0-9]{1}|sk-[A-Za-z0-9_-]{16}|xai-[A-Za-z0-9_-]{16}|AIza[A-Za-z0-9_-]{20}|hf_[A-Za-z0-9]{20}|r8_[A-Za-z0-9]{20}|ste-[A-Za-z0-9]{20}|abl_[A-Za-z0-9]{20}|pplx-[A-Za-z0-9]{20}|tk_[A-Za-z0-9_-]{20})
                  [A-Za-z0-9_-]*)|(?P<bc_isk>[A-Za-z0-9]+))
            | sk-(?P<sk>[A-Za-z0-9_-]{16,})
            | xai-(?P<xai>[A-Za-z0-9_-]{16,})
            | AIza(?P<aiza>[A-Za-z0-9_-]{20,})
            | hf_(?:(?P<hf_glued>[A-Za-z0-9]{20,}?
                  (?:github_pat_[A-Za-z0-9_]{20}|gh[a-z]_[A-Za-z0-9]{20}|bc_[a-z]{3}_[A-Za-z0-9_-]{8}|bc_uat_[A-Za-z0-9]{1}|bc_isk_[A-Za-z0-9]{1}|sk-[A-Za-z0-9_-]{16}|xai-[A-Za-z0-9_-]{16}|AIza[A-Za-z0-9_-]{20}|hf_[A-Za-z0-9]{20}|r8_[A-Za-z0-9]{20}|ste-[A-Za-z0-9]{20}|abl_[A-Za-z0-9]{20}|pplx-[A-Za-z0-9]{20}|tk_[A-Za-z0-9_-]{20})
                  [A-Za-z0-9_-]*)|(?P<hf>[A-Za-z0-9]{20,}))
            | r8_(?:(?P<r8_glued>[A-Za-z0-9]{20,}?
                  (?:github_pat_[A-Za-z0-9_]{20}|gh[a-z]_[A-Za-z0-9]{20}|bc_[a-z]{3}_[A-Za-z0-9_-]{8}|bc_uat_[A-Za-z0-9]{1}|bc_isk_[A-Za-z0-9]{1}|sk-[A-Za-z0-9_-]{16}|xai-[A-Za-z0-9_-]{16}|AIza[A-Za-z0-9_-]{20}|hf_[A-Za-z0-9]{20}|r8_[A-Za-z0-9]{20}|ste-[A-Za-z0-9]{20}|abl_[A-Za-z0-9]{20}|pplx-[A-Za-z0-9]{20}|tk_[A-Za-z0-9_-]{20})
                  [A-Za-z0-9_-]*)|(?P<r8>[A-Za-z0-9]{20,}))
            | ste-(?:(?P<ste_glued>[A-Za-z0-9]{20,}?
                  (?:github_pat_[A-Za-z0-9_]{20}|gh[a-z]_[A-Za-z0-9]{20}|bc_[a-z]{3}_[A-Za-z0-9_-]{8}|bc_uat_[A-Za-z0-9]{1}|bc_isk_[A-Za-z0-9]{1}|sk-[A-Za-z0-9_-]{16}|xai-[A-Za-z0-9_-]{16}|AIza[A-Za-z0-9_-]{20}|hf_[A-Za-z0-9]{20}|r8_[A-Za-z0-9]{20}|ste-[A-Za-z0-9]{20}|abl_[A-Za-z0-9]{20}|pplx-[A-Za-z0-9]{20}|tk_[A-Za-z0-9_-]{20})
                  [A-Za-z0-9_-]*)|(?P<ste>[A-Za-z0-9]{20,}))
            | abl_(?:(?P<abl_glued>[A-Za-z0-9]{20,}?
                  (?:github_pat_[A-Za-z0-9_]{20}|gh[a-z]_[A-Za-z0-9]{20}|bc_[a-z]{3}_[A-Za-z0-9_-]{8}|bc_uat_[A-Za-z0-9]{1}|bc_isk_[A-Za-z0-9]{1}|sk-[A-Za-z0-9_-]{16}|xai-[A-Za-z0-9_-]{16}|AIza[A-Za-z0-9_-]{20}|hf_[A-Za-z0-9]{20}|r8_[A-Za-z0-9]{20}|ste-[A-Za-z0-9]{20}|abl_[A-Za-z0-9]{20}|pplx-[A-Za-z0-9]{20}|tk_[A-Za-z0-9_-]{20})
                  [A-Za-z0-9_-]*)|(?P<abl>[A-Za-z0-9]{20,}))
            | pplx-(?:(?P<pplx_glued>[A-Za-z0-9]{20,}?
                  (?:github_pat_[A-Za-z0-9_]{20}|gh[a-z]_[A-Za-z0-9]{20}|bc_[a-z]{3}_[A-Za-z0-9_-]{8}|bc_uat_[A-Za-z0-9]{1}|bc_isk_[A-Za-z0-9]{1}|sk-[A-Za-z0-9_-]{16}|xai-[A-Za-z0-9_-]{16}|AIza[A-Za-z0-9_-]{20}|hf_[A-Za-z0-9]{20}|r8_[A-Za-z0-9]{20}|ste-[A-Za-z0-9]{20}|abl_[A-Za-z0-9]{20}|pplx-[A-Za-z0-9]{20}|tk_[A-Za-z0-9_-]{20})
                  [A-Za-z0-9_-]*)|(?P<pplx>[A-Za-z0-9]{20,}))
            | tk_(?P<tk>[A-Za-z0-9_-]{20,})
          )') -> |key| {
          before = string(key.before) ?? ""
          run = string(key.pat) ?? string(key.gh) ?? string(key.bc) ?? string(key.bc_uat) ?? string(key.bc_isk) ?? string(key.sk) ?? string(key.xai) ?? string(key.aiza) ?? string(key.hf) ?? string(key.r8) ?? string(key.ste) ?? string(key.abl) ?? string(key.pplx) ?? string(key.tk) ?? ""
          glued = string(key.pat_glued) ?? string(key.gh_glued) ?? string(key.bc_uat_glued) ?? string(key.bc_isk_glued) ?? string(key.hf_glued) ?? string(key.r8_glued) ?? string(key.ste_glued) ?? string(key.abl_glued) ?? string(key.pplx_glued) ?? ""
          if glued == "" && run != "" && match(before, r'^[\p{L}\p{N}\p{M}]') && !match(run, r'[0-9A-Z]') {
              key.string
          } else if key.pat != null || key.pat_glued != null || key.gh != null || key.gh_glued != null {
              before + "[REDACTED_GH_TOKEN]"
          } else if key.bc_isk != null || key.bc_isk_glued != null || key.bc_kind == "isk" {
              before + "[REDACTED_BC_INTEGRATION_SECRET]"
          } else if key.bc_uat != null || key.bc_uat_glued != null || key.bc != null {
              before + "[REDACTED_BC_TOKEN]"
          } else {
              before + "[REDACTED_API_KEY]"
          }
      }
      # PRESENTATION — prefix the message with the emitting program's journald identifier, so a
      # Live Tail line is self-describing: `[basecradle-router] stage=wake outcome=ok agent=… `.
      # Fall back to the process comm, then to "unknown", so a line with no identifier (a kernel
      # message) still gets a prefix rather than a bare `[] `. Prefixing AFTER redaction is
      # deliberate: the prefix is not secret-bearing and must never itself be scanned or mangled.
      # An identifier sent more than once (the native protocol allows it, and the journal then holds
      # a list) is not one name, so it ships as its JSON text, one string that names no fleet
      # program: the name a line ships under is always the name the writer check below read.
      ident = ""
      if is_string(.SYSLOG_IDENTIFIER) {
          ident = string!(.SYSLOG_IDENTIFIER)
      } else if .SYSLOG_IDENTIFIER != null {
          ident = encode_json(.SYSLOG_IDENTIFIER)
          .SYSLOG_IDENTIFIER = ident
      }
      if ident == "" { ident = to_string(."_COMM") ?? "" }
      if ident == "" { ident = "unknown" }
      # BIND THE LINE TO ITS WRITER (basecradle-router#484). A fleet identifier is every
      # `basecradle-wake-<agent>` and the five below: the names a NOC column trusts to say who wrote
      # a line. A line under one is kept as it is only when the kernel-vouched `_UID` is one the
      # `fleet_writers` map lists for that identifier: the agent's own account or root on its wake
      # stream, any registered agent for the grammar probe, the router's account for its own two,
      # root alone for the operator's stop and the NOC's deploy runner. Any other line under one, a
      # line with no `_UID` included, is KEPT AND MARKED, never dropped and never counted:
      # `UNVERIFIED uid=<n> ` stands where the severity would, so no head is at its position and no
      # column counts it, and the identifier is renamed `unverified-<identifier>`, in the field and
      # the prefix alike, so nothing attributes it to the account it named. The marker is what the
      # NOC's `Unverified Log Writer` alarm reads. It is joined into the shipped line here, never
      # written into `msg`, so the prefix pass stays the last thing that rewrites `msg`
      # (tests/test_log_surface.py) and a marked line is redacted exactly as an unmarked one.
      marker = ""
      if starts_with(ident, "basecradle-wake-") || includes(["basecradle-router", "basecradle-log-grammar", "verify-recovery.sh", "basecradle-router-stop-wake", "fleet-deploy-runner"], ident) {
          writer = to_string(."_UID") ?? ""
          vouched = false
          if writer != "" {
              listed, err = find_enrichment_table_records("fleet_writers", {"identifier": ident, "uid": writer})
              vouched = err == null && length(listed) > 0
          }
          if !vouched {
              if writer == "" { writer = "none" }
              marker = "UNVERIFIED uid=" + writer + " "
              ident = "unverified-" + ident
              .SYSLOG_IDENTIFIER = ident
          }
      }
      .message = "[" + ident + "] " + marker + msg
      # Better Stack reads the event timestamp from `dt` (mirrors the generated log parser).
      del(.source_type)
      .dt = del(.timestamp)

sinks:
  better_stack_logs:
    type: "http"
    method: "post"
    uri: "https://s2531770.eu-fsn-3.betterstackdata.com/"
    encoding:
      codec: "json"
    compression: "gzip"
    auth:
      strategy: "bearer"
      token: "${BETTERSTACK_AI_SOURCE_TOKEN}"
    inputs: ["ai_scrub"]

  better_stack_metrics:
    type: "http"
    method: "post"
    uri: "https://s2531770.eu-fsn-3.betterstackdata.com/metrics"
    encoding:
      codec: "json"
    compression: "gzip"
    auth:
      strategy: "bearer"
      token: "${BETTERSTACK_AI_SOURCE_TOKEN}"
    inputs: ["ai_host_metrics"]

  # Vector's health counters, exposed for the NOC to READ OFF THE BOX (basecradle-noc#215).
  #
  # DELIBERATELY NOT SHIPPED TO BETTER STACK. A Vector whose SINK is broken cannot ship the metric
  # that says its sink is broken — a self-report through the failing channel is not a monitor. So the
  # counters are exposed here and PULLED out-of-band by the NOC's `introspect-vector-health` op, over
  # a channel (ssh -> fleet-deploy-runner -> localhost) independent of the pipe under test.
  #
  # BOUND TO 127.0.0.1 — this is not a network service. Nothing off-box can reach it; the only reader
  # is a root-owned wrapper op on this same machine, which returns counts and never log text.
  ai_vector_health_exporter:
    type: "prometheus_exporter"
    inputs: ["ai_internal_metrics"]
    address: "127.0.0.1:9598"

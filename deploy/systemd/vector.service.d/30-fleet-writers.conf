# systemd drop-in for the Vector agent on every router host: build the writer map before Vector starts.
#
# Every host's vector.yaml reads /etc/vector/fleet-writers.csv as its `fleet_writers` table, the map
# `ai_scrub` binds every fleet journal line to its writer by (basecradle-router#484), and Vector
# cannot start without it (measured on 0.61.0; `vector validate --no-environment` passes without
# it). basecradle-router-writers.service builds it, and is pulled in by the daemon's own unit too;
# this drop-in binds it at the consumer, so every start of Vector runs it first, whatever started
# Vector. `Wants=`, never `Requires=`: a writer that fails still leaves a map that loads (it writes
# one that vouches for no one when there is none), and Vector starts on it.
#
# Install (on-box, root; the same path as the other two drop-ins, deploy/README "Part 5 — Telemetry"):
#   sudo install -D -o root -g root -m 644 \
#     deploy/systemd/vector.service.d/30-fleet-writers.conf \
#     /etc/systemd/system/vector.service.d/30-fleet-writers.conf
#   sudo systemctl daemon-reload

[Unit]
Wants=basecradle-router-writers.service
After=basecradle-router-writers.service

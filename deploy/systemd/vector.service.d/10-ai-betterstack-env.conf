# systemd drop-in for the Better Stack Vector agent on the router box (ai.basecradle.com).
#
# Vector ships its own /lib/systemd/system/vector.service from the apt package; we DO NOT replace it.
# This drop-in only feeds it the ingest token for ${BETTERSTACK_AI_SOURCE_TOKEN} interpolation in
# /etc/vector/vector.yaml (deploy/vector.yaml), keeping the secret out of the repo and the YAML.
#
# Install (capital, on-box; see deploy/README "Part 5 — Telemetry"):
#   sudo install -D -o root -g root -m 644 \
#     deploy/systemd/vector.service.d/10-ai-betterstack-env.conf \
#     /etc/systemd/system/vector.service.d/10-ai-betterstack-env.conf
#   sudo systemctl daemon-reload && sudo systemctl restart vector
#
# The referenced env file holds the secret and is created out-of-band, chmod 640 root:vector
# (least privilege: the `vector` OS user reads it; nothing else does). It is NEVER in git.

[Service]
EnvironmentFile=/etc/vector/betterstack.env

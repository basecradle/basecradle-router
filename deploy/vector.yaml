# BaseCradle router (ai.basecradle.com) — Better Stack Vector config
# (telemetry: host metrics + scrubbed journald).
#
# Canonical, version-controlled config for the router box. It mirrors basecradle-noc's proven,
# security-hardened config (basecradle-noc#31 enabled telemetry; basecradle-noc#33 / basecradle#338
# hardened the scrub after an unscrubbed-journald secret leak). Install: deploy/README "Part 5 — Telemetry".
#
# Tailored to this box (a webhook daemon + Caddy, no database), so the generated kitchen-sink config
# (apache/nginx/mysql/mongo/redis/postgres log + metric sources scraping absent localhost endpoints)
# is replaced with exactly what this box has:
#   * journald         — ALL system logs AND the router's own software: the basecradle-router.service
#                        uvicorn daemon and the drift/reboot/recovery units all log to the journal via
#                        stdout/stderr. journald (not a /var/log/*.log tail) catches /var/log/syslog too.
#   * host_metrics     — CPU / memory / disk / load / network.
#   * internal_metrics — Vector's OWN health counters (basecradle-noc#215), exposed on a localhost-only
#                        prometheus endpoint and PULLED out-of-band by the NOC. Never shipped to Better
#                        Stack: a broken transport cannot ship the metric that says it is broken.
#
# SECURITY — never ship raw journald to an external store (basecradle-noc#33 / basecradle#338).
# The `ai_scrub` transform runs before the logs sink and:
#   * DROPS whole events from `sudo` (PAM logs the full argv — any secret passed on a command
#     line lands here; the router escalates a wake via `sudo -> wake-runner`, so this matters) and
#     from Vector itself (its own logs can echo the sink token via component ids/config — this is
#     how the source token leaked ~40x on the NOC box);
#   * DELETES `_CMDLINE` from EVERY event — journald attaches the emitting process's full argv as
#     a metadata FIELD, which no message-level redaction reaches (basecradle-noc#443);
#   * REDACTS secret-shaped patterns (GitHub tokens, `Bearer` creds, `/heartbeat/` URLs, `bc_uat_`,
#     and provider API keys — `sk-…`, `xai-…`, `AIza…` and kin) from the message as defense in depth.
#
# The `_CMDLINE` deletion is UNCONDITIONAL — the guard is on the field, never on an allow-list of
# identifiers known to be dangerous. The `sudo` drop above was written as if `sudo` were *the* argv
# carrier on this box; it is not, and `runuser` is what got past it (basecradle-noc#443). The
# reasoning is at the rule itself, in the transform below.
#
# PRESENTATION (basecradle-router#170) — the `ai_scrub` transform also PREFIXES each shipped message
# with its journald `SYSLOG_IDENTIFIER`, so a Better Stack Live Tail line reads `[basecradle-router] …`
# or `[basecradle-wake-jt] …` and says which program on the box emitted it. Doing it HERE, once, is what
# makes it uniform: every program on the box gets the prefix for free, whereas hand-prefixing `[Router]`
# into the daemon's own log strings would cover only the daemon (never sshd, Caddy, or a wake) and would
# bake a presentation concern into application code. The identifier is journald's, so it is only as good
# as the program's name — which is why basecradle-router.service now sets `SyslogIdentifier=` (before
# that, the daemon's lines were stamped `uv`, the name of its *launcher*).
# The source ingest token is NOT in this file — it is interpolated from
# ${BETTERSTACK_AI_SOURCE_TOKEN}, supplied to vector.service via the chmod-640 EnvironmentFile
# /etc/vector/betterstack.env (a systemd drop-in), so the secret never lives in the repo or the
# YAML, and a rotation is a one-line swap of that env file.

sources:
  ai_journald:
    type: "journald"
    current_boot_only: true

  ai_host_metrics:
    type: "host_metrics"
    scrape_interval_secs: 30
    collectors: [cpu, disk, filesystem, load, host, memory, network]
    # Don't scrape what we cannot read (basecradle#414). The `filesystem` collector stats every
    # mount in /proc/mounts, and `/sys/kernel/debug/tracing` (tracefs, under a 0700 debugfs) is
    # unreadable by the unprivileged `vector` user — so every 30s scrape logged an ERROR
    # (`statvfs`: permission denied), ~2,880/day, training a human reading the box's journal in an
    # incident to skim past ERROR. Excluding by filesystem *type* rather than by mountpoint path
    # is deliberate: tracefs is mounted at both /sys/kernel/tracing and /sys/kernel/debug/tracing,
    # and the type is the durable fact — these are pseudo-filesystems with no capacity to report,
    # so their usage metrics were never wanted. The exclude is checked before the statvfs, so the
    # syscall is never attempted; every real filesystem is still collected (an excludes-only list
    # includes everything else).
    filesystem:
      filesystems:
        excludes: ["tracefs", "debugfs"]

  # Vector's own health (basecradle-noc#215) — the transport that ships this box's log stream is the
  # one component nothing watches. Its own logs are DROPPED from the stream (they echo the sink
  # token — basecradle#338), so Better Stack cannot see it; `introspect-vector` reads only
  # "installed and running", which a running-but-broken Vector satisfies perfectly.
  #
  # These counters are the ONLY thing that sees a SILENT drop: a VRL aborting 100% of events logs
  # NOTHING, yet these read received=N, sent=0, discarded=N.
  ai_internal_metrics:
    type: "internal_metrics"
    scrape_interval_secs: 30

transforms:
  ai_scrub:
    type: "remap"
    inputs:
      - "ai_journald"
    drop_on_abort: true
    reroute_dropped: false
    source: |
      # Drop whole events that are known secret carriers. sudo logs the full command line (argv)
      # via PAM, so any secret ever passed on a command line is here; Vector's own logs can echo
      # the sink token (component ids / config). Never ship either back to Better Stack.
      if .SYSLOG_IDENTIFIER == "sudo" || ."_COMM" == "sudo" || .SYSLOG_IDENTIFIER == "vector" || ."_SYSTEMD_UNIT" == "vector.service" {
          abort
      }
      # Drop the emitting process's full command line, from EVERY event (basecradle-noc#443).
      # journald attaches argv as the `_CMDLINE` METADATA FIELD, and Vector ships the whole journal
      # record, not just MESSAGE — so every `msg` redaction below is blind to it. The rule above
      # drops `sudo` because PAM logs argv, but that is an identifier allow-list, and `runuser` is
      # not `sudo`: the NOC's fleet-deploy-runner passing `env -i KEY=VALUE …` on argv put all seven
      # harness agents' credentials into the log store through exactly that gap.
      #
      # Unconditional on purpose. Guarding the FIELD holds for every program on this box, including
      # ones this repo has never heard of; guarding a list of identifiers holds only until the next
      # program puts a secret on its own command line, and nothing would announce that. Nothing
      # observable is lost: `_COMM`/`_EXE` still name the binary, and the `[identifier]` prefix added
      # below names the emitting program on every line.
      del(."_CMDLINE")
      # Redact secret-shaped patterns from the message (defense in depth for anything else that
      # logs a secret to stdout — e.g. a heartbeat ping logging its own secret URL on failure).
      msg = to_string(.message) ?? ""
      msg = replace(msg, r'gh[a-z]_[A-Za-z0-9]{20,}', "[REDACTED_GH_TOKEN]")
      msg = replace(msg, r'(?i)bearer\s+[A-Za-z0-9._~+/\-]+=*', "Bearer [REDACTED]")
      msg = replace(msg, r'https?://\S*/heartbeat/\S+', "[REDACTED_HEARTBEAT_URL]")
      msg = replace(msg, r'bc_uat_[A-Za-z0-9]+', "[REDACTED_BC_TOKEN]")
      # Provider API keys. Harness agents and builder agents run with these in their env
      # (ANTHROPIC_API_KEY, OPENROUTER_API_KEY, …) and a wake's stdout+stderr — a traceback,
      # a curl echo, a misconfigured debug print — now flows into journald under
      # basecradle-wake-<slug> (#168), so it flows through here. Nothing is known to print one;
      # this is the belt for the braces. The `sk-` rule covers the whole family that shares
      # the prefix (sk-ant-, sk-proj-, sk-or-v1-, …) in one pattern.
      msg = replace(msg, r'sk-[A-Za-z0-9_-]{16,}', "[REDACTED_API_KEY]")
      msg = replace(msg, r'xai-[A-Za-z0-9]{16,}', "[REDACTED_API_KEY]")
      msg = replace(msg, r'AIza[A-Za-z0-9_-]{20,}', "[REDACTED_API_KEY]")
      msg = replace(msg, r'hf_[A-Za-z0-9]{20,}', "[REDACTED_API_KEY]")
      msg = replace(msg, r'r8_[A-Za-z0-9]{20,}', "[REDACTED_API_KEY]")
      # PRESENTATION — prefix the message with the emitting program's journald identifier, so a
      # Live Tail line is self-describing: `[basecradle-router] stage=wake outcome=ok agent=… `.
      # Fall back to the process comm, then to "unknown", so a line with no identifier (a kernel
      # message) still gets a prefix rather than a bare `[] `. Prefixing AFTER redaction is
      # deliberate: the prefix is not secret-bearing and must never itself be scanned or mangled.
      ident = to_string(.SYSLOG_IDENTIFIER) ?? ""
      if ident == "" { ident = to_string(."_COMM") ?? "" }
      if ident == "" { ident = "unknown" }
      .message = "[" + ident + "] " + msg
      # Better Stack reads the event timestamp from `dt` (mirrors the generated log parser).
      del(.source_type)
      .dt = del(.timestamp)

sinks:
  better_stack_logs:
    type: "http"
    method: "post"
    uri: "https://s2531770.eu-fsn-3.betterstackdata.com/"
    encoding:
      codec: "json"
    compression: "gzip"
    auth:
      strategy: "bearer"
      token: "${BETTERSTACK_AI_SOURCE_TOKEN}"
    inputs: ["ai_scrub"]

  better_stack_metrics:
    type: "http"
    method: "post"
    uri: "https://s2531770.eu-fsn-3.betterstackdata.com/metrics"
    encoding:
      codec: "json"
    compression: "gzip"
    auth:
      strategy: "bearer"
      token: "${BETTERSTACK_AI_SOURCE_TOKEN}"
    inputs: ["ai_host_metrics"]

  # Vector's health counters, exposed for the NOC to READ OFF THE BOX (basecradle-noc#215).
  #
  # DELIBERATELY NOT SHIPPED TO BETTER STACK. A Vector whose SINK is broken cannot ship the metric
  # that says its sink is broken — a self-report through the failing channel is not a monitor. So the
  # counters are exposed here and PULLED out-of-band by the NOC's `introspect-vector-health` op, over
  # a channel (ssh -> fleet-deploy-runner -> localhost) independent of the pipe under test.
  #
  # BOUND TO 127.0.0.1 — this is not a network service. Nothing off-box can reach it; the only reader
  # is a root-owned wrapper op on this same machine, which returns counts and never log text.
  ai_vector_health_exporter:
    type: "prometheus_exporter"
    inputs: ["ai_internal_metrics"]
    address: "127.0.0.1:9598"
